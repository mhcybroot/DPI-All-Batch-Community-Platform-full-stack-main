<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Wall — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>🖼 Memory Wall</h1>
                <p>Shared photos and videos from our community.</p>
            </div>

            <!-- Upload Form -->
            <div class="card" style="margin-bottom:1.5rem;">
                <h3 class="card-title" style="margin-bottom:1rem;">Share a Memory</h3>
                <form th:action="@{/web/memories}" method="post">
                    <div class="form-group">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" required
                            placeholder="Give your memory a title">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="2"
                            placeholder="Describe this memory..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Media URL</label>
                        <input type="url" name="mediaUrl" class="form-control" required placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Media Type</label>
                        <select name="mediaType" class="form-control">
                            <option value="IMAGE">Image</option>
                            <option value="VIDEO">Video</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Memory</button>
                </form>
            </div>

            <!-- Gallery -->
            <div class="grid grid-3" th:if="${memories != null and !memories.isEmpty()}">
                <div class="card" th:each="memory : ${memories}">
                    <div class="card-header">
                        <span class="card-title" th:text="${memory.title}">Title</span>
                    </div>
                    <div class="card-body">
                        <p th:if="${memory.description}" th:text="${memory.description}">Desc</p>
                        <p class="card-meta">Type: <span th:text="${memory.mediaType}">IMAGE</span></p>
                    </div>
                    <div class="card-footer" th:if="${memory.uploaderId == currentUserId or isAdmin}">
                        <form th:action="@{/web/memories/{id}/delete(id=${memory.id})}" method="post"
                            onsubmit="return confirm('Delete this memory?')">
                            <button type="submit" class="btn btn-danger btn-sm">🗑 Delete</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="empty-state" th:if="${memories == null or memories.isEmpty()}">
                <div class="empty-icon">🖼</div>
                <p>No memories shared yet. Be the first!</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
