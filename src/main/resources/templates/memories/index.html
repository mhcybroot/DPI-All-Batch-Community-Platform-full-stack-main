<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Wall — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>🖼 Memory Wall</h1>
                <p>Shared photos and videos from our community.</p>
            </div>

            <!-- Items per page selector -->
            <div class="pagination-controls" th:if="${memoriesPage != null and memoriesPage.hasContent()}">
                <form method="get" th:action="@{/web/memories}">
                    <label>Show:</label>
                    <select name="size" onchange="this.form.submit()">
                        <option th:value="10" th:selected="${memoriesPage.size == 10}">10</option>
                        <option th:value="20" th:selected="${memoriesPage.size == 20}">20</option>
                        <option th:value="50" th:selected="${memoriesPage.size == 50}">50</option>
                    </select>
                </form>
            </div>

            <!-- Upload Form -->
            <button id="toggle-memory-form" class="btn btn-magnetic-primary mb-4" data-magnetic
                style="margin-bottom: 1.5rem;">
                <span class="hover-text-reveal">+ Share a Memory</span>
            </button>

            <div id="memory-form-container" class="card glass-card" style="margin-bottom:1.5rem; display: none;">
                <div class="card-body">
                    <h3 class="card-title kinetic-text" style="margin-bottom:1rem;">Share a Memory</h3>
                    <form th:action="@{/web/memories}" method="post">
                        <div class="form-group">
                            <label class="form-label text-muted">Title</label>
                            <input type="text" name="title" class="form-control glass-input" required
                                placeholder="Give your memory a title">
                        </div>
                        <div class="form-group">
                            <label class="form-label text-muted">Description</label>
                            <textarea name="description" class="form-control glass-input" rows="2"
                                placeholder="Describe this memory..."></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label text-muted">Media URL</label>
                            <input type="url" name="mediaUrl" class="form-control glass-input" required
                                placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label class="form-label text-muted">Media Type</label>
                            <select name="mediaType" class="form-control glass-input">
                                <option value="IMAGE" style="background: var(--color-obsidian);">Image</option>
                                <option value="VIDEO" style="background: var(--color-obsidian);">Video</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-magnetic-primary" data-magnetic>
                            <span class="hover-text-reveal">Upload Memory</span>
                        </button>
                    </form>
                </div>
            </div>

            <script>
                document.getElementById('toggle-memory-form').addEventListener('click', function () {
                    const formContainer = document.getElementById('memory-form-container');
                    if (formContainer.style.display === 'none') {
                        formContainer.style.display = 'block';

                        // GSAP Reveal if available
                        if (typeof gsap !== 'undefined') {
                            gsap.fromTo(formContainer,
                                { height: 0, opacity: 0 },
                                { height: 'auto', opacity: 1, duration: 0.5, ease: "cubic-bezier(0.23, 1, 0.32, 1)" }
                            );
                        }
                        this.style.display = 'none'; // Hide button after clicking (optional, or change text)
                    }
                });
            </script>

            <!-- Gallery -->
            <div class="grid grid-3 floating-grid" th:if="${memoriesPage != null and memoriesPage.hasContent()}"
                style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem;">
                <div class="card glass-card gsap-reveal" th:each="memory : ${memoriesPage.content}" data-magnetic
                    style="overflow: hidden; padding: 0; display: flex; flex-direction: column; height: 100%;">

                    <!-- Media Section -->
                    <div style="position: relative; aspect-ratio: 4/3; overflow: hidden; background: #000;">
                        <div class="media-container" th:data-url="${memory.mediaUrl}" th:data-type="${memory.mediaType}"
                            style="width: 100%; height: 100%; position: relative;">
                            <!-- Content injected by JS -->
                            <div class="media-placeholder"
                                style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#000;">
                                <span class="spinner"
                                    style="width:20px; height:20px; border:2px solid rgba(255,255,255,0.3); border-top:2px solid white; border-radius:50%; animation:spin 1s linear infinite;"></span>
                            </div>
                        </div>

                        <div class="memory-overlay"
                            style="position: absolute; bottom: 0; left: 0; right: 0; padding: 1rem; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); pointer-events: none;">
                            <span class="badge" th:text="${memory.mediaType}"
                                style="font-size: 0.7rem; background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); padding: 0.2rem 0.5rem; border-radius: 4px; color: white;">TYPE</span>
                        </div>
                    </div>

                    <!-- Content Section -->
                    <div class="card-body" style="padding: 1.5rem; flex: 1; display: flex; flex-direction: column;">
                        <h4 class="card-title kinetic-text" th:text="${memory.title}"
                            style="margin-bottom: 0.5rem; color: var(--color-frozen-white);">Title</h4>
                        <p th:if="${memory.description}" th:text="${memory.description}" class="text-muted"
                            style="font-size: 0.9rem; flex: 1;">Desc</p>

                        <div
                            style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
                            <span class="mono-text" style="font-size: 0.75rem; color: var(--color-silicon-gray);"
                                th:text="${#temporals.format(memory.createdAt, 'dd MMM yyyy')}">Date</span>

                            <form th:if="${memory.uploaderId == currentUserId or isAdmin}"
                                th:action="@{/web/memories/{id}/delete(id=${memory.id})}" method="post"
                                onsubmit="return confirm('Delete this memory?')">
                                <button type="submit" class="btn-text-danger"
                                    style="font-size: 0.8rem; background: none; border: none; cursor: pointer; color: #ef4444;">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" th:if="${memoriesPage.totalPages > 1}"
                style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
                <a th:if="${memoriesPage.number > 0}"
                    th:href="@{/web/memories(page=${memoriesPage.number - 1},size=${memoriesPage.size})}"
                    class="btn-magnetic">← Previous</a>
                <span class="glass-card" style="padding: 0.5rem 1rem; align-self: center;"
                    th:text="${memoriesPage.number + 1 + ' / ' + memoriesPage.totalPages}">1/1</span>
                <a th:if="${memoriesPage.number < memoriesPage.totalPages - 1}"
                    th:href="@{/web/memories(page=${memoriesPage.number + 1},size=${memoriesPage.size})}"
                    class="btn-magnetic">Next →</a>
            </div>

            <style>
                .memory-img:hover {
                    transform: scale(1.05);
                }

                .btn-text-danger:hover {
                    text-decoration: underline;
                }
            </style>
            <div class="empty-state" th:if="${memoriesPage == null or !memoriesPage.hasContent()}">
                <div class="empty-icon">🖼</div>
                <p>No memories shared yet. Be the first!</p>
            </div>
        </div>
    </main>

    <!-- Lightbox Overlay -->
    <div id="memory-lightbox" class="lightbox">
        <button class="lightbox-close">&times;</button>
        <div class="lightbox-content"></div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>

    <style>
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Lightbox Styles */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-content {
            width: 80vw;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: black;
        }

        .lightbox-content img,
        .lightbox-content video,
        .lightbox-content iframe {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .lightbox-content iframe {
            width: 100%;
            height: 100%;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 3rem;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10000;
            transition: transform 0.2s;
        }

        .lightbox-close:hover {
            transform: scale(1.1);
            color: #ef4444;
        }

        .media-container {
            cursor: pointer;
        }

        .media-container:hover {
            opacity: 0.9;
            transition: opacity 0.2s;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lightbox Elements
            const lightbox = document.getElementById('memory-lightbox');
            const lightboxContent = lightbox.querySelector('.lightbox-content');
            const closeBtn = lightbox.querySelector('.lightbox-close');

            // Close Functions
            const closeLightbox = () => {
                lightbox.classList.remove('active');
                setTimeout(() => {
                    lightboxContent.innerHTML = ''; // Stop videos
                }, 300);
            };

            if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
            if (lightbox) lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox && lightbox.classList.contains('active')) closeLightbox();
            });

            document.querySelectorAll('.media-container').forEach(container => {
                const url = container.dataset.url;
                const type = container.dataset.type;
                const placeholder = container.querySelector('.media-placeholder');

                if (type === 'VIDEO') {
                    let embedHtml = '';

                    // YouTube
                    const ytMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
                    // Vimeo
                    const vimeoMatch = url.match(/(?:vimeo.com\/)(\d+)/);

                    if (ytMatch) {
                        embedHtml = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${ytMatch[1]}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute; top:0; left:0;"></iframe>`;
                    } else if (vimeoMatch) {
                        embedHtml = `<iframe src="https://player.vimeo.com/video/${vimeoMatch[1]}" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen" allowfullscreen style="position:absolute; top:0; left:0;"></iframe>`;
                    } else {
                        // Direct File Fallback
                        embedHtml = `<video src="${url}" controls style="width:100%; height:100%; object-fit:cover;"></video>`;
                    }

                    container.innerHTML = embedHtml;

                } else if (type === 'IMAGE') {
                    const img = new Image();
                    img.src = url;
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'cover';
                    img.style.transition = 'transform 0.5s cubic-bezier(0.23, 1, 0.32, 1)';
                    img.classList.add('memory-img');

                    img.onload = () => {
                        container.innerHTML = '';
                        container.appendChild(img);
                    };

                    img.onerror = () => {
                        container.innerHTML = `
                            <div style="width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#1a1a1a; color:#666;">
                                <span style="font-size:2rem;">⚠️</span>
                                <span style="font-size:0.8rem; margin-top:0.5rem;">Image not found</span>
                            </div>
                        `;
                    };
                }

                // Add Click Listener for Lightbox
                container.addEventListener('click', () => {
                    let contentToClone = container.innerHTML;

                    // For direct videos
                    if (type === 'VIDEO' && contentToClone.includes('<video')) {
                        contentToClone = contentToClone.replace('object-fit:cover', 'object-fit:contain');
                    }

                    lightboxContent.innerHTML = contentToClone;

                    // For images
                    const lightboxImg = lightboxContent.querySelector('img');
                    if (lightboxImg) {
                        lightboxImg.style.objectFit = 'contain';
                        lightboxImg.style.width = '100%';
                        lightboxImg.style.height = '100%';
                    }

                    lightbox.classList.add('active');
                });
            });
        });
    </script>
</body>

</html>
