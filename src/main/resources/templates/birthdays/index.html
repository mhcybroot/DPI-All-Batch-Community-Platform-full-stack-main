<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthdays — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>🎂 Birthday Dashboard</h1>
            </div>

            <div class="grid grid-2">
                <div class="section">
                    <h2 class="section-title">🎉 Today's Birthdays</h2>
                    <div th:if="${todayBirthdays != null and !todayBirthdays.isEmpty()}">
                        <div class="card" th:each="bday : ${todayBirthdays}" style="margin-bottom:0.75rem;">
                            <div class="card-body">
                                <strong th:text="${bday.fullName}">Name</strong>
                                <span class="badge badge-success" style="margin-left:0.5rem;">🎂 Today!</span>
                            </div>
                        </div>
                    </div>
                    <div class="card empty-state" th:if="${todayBirthdays == null or todayBirthdays.isEmpty()}">
                        <p>No birthdays today</p>
                    </div>
                </div>

                <div class="section">
                    <h2 class="section-title">📅 Upcoming (Next 7 Days)</h2>
                    <div th:if="${upcomingBirthdays != null and !upcomingBirthdays.isEmpty()}">
                        <div class="card" th:each="bday : ${upcomingBirthdays}" style="margin-bottom:0.75rem;">
                            <div class="card-body">
                                <strong th:text="${bday.fullName}">Name</strong>
                                <span class="card-meta" th:text="' — ' + ${bday.dateOfBirth}">Date</span>
                            </div>
                        </div>
                    </div>
                    <div class="card empty-state" th:if="${upcomingBirthdays == null or upcomingBirthdays.isEmpty()}">
                        <p>No upcoming birthdays</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
