<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>✏️ Edit Job Posting</h1>
            </div>
            <form th:action="@{/web/jobs/{id}/edit(id=${job.id})}" method="post" class="card" style="max-width:600px;">
                <div class="form-group"><label class="form-label">Title</label><input type="text" name="title"
                        class="form-control" th:value="${job.title}" required></div>
                <div class="form-group"><label class="form-label">Company</label><input type="text" name="companyName"
                        class="form-control" th:value="${job.companyName}"></div>
                <div class="form-group"><label class="form-label">Location</label><input type="text" name="location"
                        class="form-control" th:value="${job.location}"></div>
                <div class="form-group"><label class="form-label">Job Type</label>
                    <select name="jobType" class="form-control">
                        <option th:each="type : ${jobTypes}" th:value="${type}" th:text="${type}"
                            th:selected="${type == job.jobType}">TYPE</option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Description</label><textarea name="description"
                        class="form-control" rows="4" th:text="${job.description}"></textarea></div>
                <div class="form-group"><label class="form-label">Requirements</label><textarea name="requirements"
                        class="form-control" rows="3" th:text="${job.requirements}"></textarea></div>
                <div class="form-group"><label class="form-label">Application Link</label><input type="url"
                        name="applicationLink" class="form-control" th:value="${job.applicationLink}"></div>
                <div class="form-group"><label class="form-label">Deadline</label><input type="date" name="deadline"
                        class="form-control" th:value="${job.deadline}"></div>
                <div style="display:flex;gap:0.75rem;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/web/jobs/{id}(id=${job.id})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
