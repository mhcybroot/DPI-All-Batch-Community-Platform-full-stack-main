<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>💼 Post a Job</h1>
            </div>
            <form th:action="@{/web/jobs}" method="post" class="card" style="max-width:600px;">
                <div class="form-group"><label class="form-label">Title</label><input type="text" name="title"
                        class="form-control" required placeholder="e.g. Senior Java Developer"></div>
                <div class="form-group"><label class="form-label">Company</label><input type="text" name="companyName"
                        class="form-control" required placeholder="Company name"></div>
                <div class="form-group"><label class="form-label">Location</label><input type="text" name="location"
                        class="form-control" placeholder="e.g. Dhaka, Remote"></div>
                <div class="form-group"><label class="form-label">Job Type</label>
                    <select name="jobType" class="form-control">
                        <option value="FULL_TIME">Full Time</option>
                        <option value="PART_TIME">Part Time</option>
                        <option value="CONTRACT">Contract</option>
                        <option value="INTERNSHIP">Internship</option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Salary Range</label><input type="text"
                        name="salaryRange" class="form-control" placeholder="e.g. 50k-80k BDT"></div>
                <div class="form-group"><label class="form-label">Description</label><textarea name="description"
                        class="form-control" rows="5" required
                        placeholder="Job requirements, responsibilities..."></textarea></div>
                <div class="form-group"><label class="form-label">Application URL</label><input type="url"
                        name="applicationLink" class="form-control" placeholder="https://..."></div>
                <div style="display:flex;gap:0.75rem;"><button type="submit" class="btn btn-primary">Post Job</button><a
                        th:href="@{/web/jobs}" class="btn btn-secondary">Cancel</a></div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
