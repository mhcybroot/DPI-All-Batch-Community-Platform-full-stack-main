<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 class="kinetic-text">💬 Discussion Forum</h1>
                    <p class="text-muted">Browse categories and join the conversation.</p>
                </div>
                <div sec:authorize="hasRole('ADMINISTRATOR')">
                    <a th:href="@{/web/forum/categories/new}" class="btn btn-primary btn-magnetic" data-magnetic>
                        + Create Category
                    </a>
                </div>
            </div>


            <div class="grid grid-3 floating-grid" th:if="${categories != null and !categories.isEmpty()}">
                <a th:each="cat : ${categories}" th:href="@{/web/forum/category/{id}(id=${cat.id})}"
                    class="card glass-card gsap-reveal"
                    style="text-decoration:none; color:inherit; display:block; position: relative;" data-magnetic>
                    <div class="card-header">
                        <span class="card-title kinetic-text" th:text="${cat.name}">Category</span>
                    </div>
                    <div class="card-body text-muted" th:text="${cat.description ?: 'Browse posts in this category'}">
                        Description
                    </div>

                    <div sec:authorize="hasRole('ADMINISTRATOR')"
                        style="position:absolute; top:0.5rem; right:0.5rem; z-index: 10;">
                        <object th:href="@{/web/forum/categories/{id}/edit(id=${cat.id})}"
                            class="btn btn-sm btn-secondary" style="padding:0.25rem 0.5rem; font-size:0.75rem;"
                            title="Edit Category"
                            onclick="window.location.href=this.getAttribute('th:href'); return false;">✏️</object>
                        <!-- Note: Using object/onclick to prevent nested a-tag issues, or we can move admin button outside the main anchor -->
                    </div>
                </a>
            </div>

            <div class="empty-state glass-card gsap-reveal" th:if="${categories == null or categories.isEmpty()}">
                <div class="empty-icon" style="filter: drop-shadow(0 0 10px var(--color-cyber-copper));">💬</div>
                <p class="text-muted">No forum categories yet. The silence is deafening.</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
