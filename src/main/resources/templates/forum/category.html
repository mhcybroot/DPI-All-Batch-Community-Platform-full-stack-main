<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Posts — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header kinetic-text"
                style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>📂 Posts</h1>
                    <p class="text-muted" th:text="${category.name}">Category Name</p>
                </div>
                <div class="actions">
                    <a th:href="@{/web/forum}" class="btn btn-secondary btn-magnetic" data-magnetic>← Back</a>
                    <a th:href="@{/web/forum/posts/new(categoryId=${category.id})}" class="btn btn-primary btn-magnetic"
                        data-magnetic>+ New Post</a>
                </div>
            </div>

            <div class="grid grid-2 floating-grid" th:if="${posts != null and !posts.isEmpty()}">
                <a th:each="post : ${posts}" th:href="@{/web/forum/posts/{id}(id=${post.id})}"
                    class="card glass-card gsap-reveal" style="text-decoration: none; color: inherit;" data-magnetic>
                    <div class="card-header">
                        <span class="card-title text-green kinetic-text" th:text="${post.title}">Post Title</span>
                        <span class="card-meta"
                            th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">Date</span>
                    </div>
                    <div class="card-body">
                        <p class="text-muted" th:text="${#strings.abbreviate(post.content, 150)}">Preview</p>
                    </div>
                </a>
            </div>
            <div class="card glass-card empty-state gsap-reveal" th:if="${posts == null or posts.isEmpty()}">
                <p>No posts yet. Be the first to start a discussion!</p>
            </div>

        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
