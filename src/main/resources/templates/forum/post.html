<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title + ' — DPI Community'}">Post — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">

            <a th:href="@{/web/forum/category/{id}(id=${post.categoryId})}"
                class="btn btn-secondary btn-sm btn-magnetic" style="margin-bottom:1rem;" data-magnetic>← Back to
                Category</a>

            <!-- Post -->
            <article class="card glass-card gsap-reveal" style="margin-bottom:2rem;">
                <div class="card-header">
                    <h1 class="card-title kinetic-text text-green" th:text="${post.title}">Title</h1>
                    <div class="card-meta">
                        <span th:text="${post.authorName}">Author</span> •
                        <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}">Date</span>
                    </div>
                </div>
                <div class="card-body"
                    style="white-space: pre-wrap; word-break: break-word; line-height: 1.6; color: var(--text);"
                    th:text="${post.content}">Content</div>
                <div class="card-footer" th:if="${post.authorId == currentUserId or isAdmin}"
                    style="gap: 1rem; border-top: 1px solid var(--glass-border-color); padding-top: 1rem;">
                    <a th:href="@{/web/forum/posts/{id}/edit(id=${post.id})}"
                        class="btn btn-secondary btn-sm btn-magnetic" data-magnetic>✏️ Edit Post</a>
                    <form th:action="@{/web/forum/posts/{id}/delete(id=${post.id})}" method="post"
                        onsubmit="return confirm('Delete this post?')">
                        <button type="submit" class="btn btn-danger btn-sm btn-magnetic" data-magnetic>🗑 Delete
                            Post</button>
                    </form>
                </div>
            </article>

            <!-- Comments -->
            <section class="section gsap-reveal">
                <h2 class="section-title kinetic-text">💬 Comments (<span
                        th:text="${commentsPage != null ? commentsPage.totalElements : 0}">0</span>)</h2>

                <h3 class="kinetic-text">Comments (<span th:text="${commentsPage.totalElements}">0</span>)</h3>

                <!-- Items per page selector -->
                <div class="pagination-controls" th:if="${commentsPage != null and commentsPage.totalElements > 0}">
                    <form method="get" th:action="@{/web/forum/posts/{id}(id=${post.id})}">
                        <label>Show:</label>
                        <select name="size" onchange="this.form.submit()">
                            <option th:value="10" th:selected="${commentsPage.size == 10}">10</option>
                            <option th:value="20" th:selected="${commentsPage.size == 20}">20</option>
                            <option th:value="50" th:selected="${commentsPage.size == 50}">50</option>
                        </select>
                    </form>
                </div>

                <div class="comments-list">
                    <div class="card glass-card comment-card gsap-reveal" th:each="comment : ${commentsPage.content}">
                        <div class="card-header">
                            <span class="comment-author" th:text="${comment.authorName}">Author</span>
                            <div class="comment-meta">
                                <span th:text="${#temporals.format(comment.createdAt, 'dd MMM yy HH:mm')}">Date</span>
                                <form th:if="${currentUserId == comment.authorId or isAdmin}"
                                    th:action="@{/web/forum/comments/{id}/delete(id=${comment.id})}" method="post"
                                    style="display:inline;" onsubmit="return confirm('Delete this comment?');">
                                    <input type="hidden" name="postId" th:value="${post.id}">
                                    <button type="submit" class="btn-link text-red">Delete</button>
                                </form>
                            </div>
                        </div>
                        <div class="card-body">
                            <p th:text="${comment.content}" style="white-space: pre-wrap; word-break: break-word;">
                                Comment content</p>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" th:if="${commentsPage.totalPages > 1}" style="margin-top: 2rem;">
                    <a th:if="${commentsPage.hasPrevious()}"
                        th:href="@{/web/forum/posts/{id}(id=${post.id}, page=${commentsPage.number - 1}, size=${commentsPage.size})}"
                        class="btn btn-secondary btn-sm">Previous</a>

                    <span th:each="i : ${#numbers.sequence(0, commentsPage.totalPages - 1)}">
                        <a th:href="@{/web/forum/posts/{id}(id=${post.id}, page=${i}, size=${commentsPage.size})}"
                            th:text="${i + 1}"
                            th:class="${i == commentsPage.number ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'}">1</a>
                    </span>

                    <a th:if="${commentsPage.hasNext()}"
                        th:href="@{/web/forum/posts/{id}(id=${post.id}, page=${commentsPage.number + 1}, size=${commentsPage.size})}"
                        class="btn btn-secondary btn-sm">Next</a>
                </div>

                <div class="card glass-card empty-state"
                    th:if="${commentsPage == null or commentsPage.content.isEmpty()}" style="margin-bottom: 2rem;">
                    <p>No comments yet. Start the conversation!</p>
                </div>

                <!-- Add Comment -->
                <form th:action="@{/web/forum/posts/{id}/comments(id=${post.id})}" method="post"
                    class="card glass-card gsap-reveal" style="margin-top:2rem;">
                    <div class="form-group">
                        <label class="form-label text-copper">Add a comment</label>
                        <textarea name="content" class="form-control" rows="3" required
                            placeholder="Write your comment..."
                            style="background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.1); color: var(--text);"></textarea>
                    </div>
                    <div style="margin-top: 1rem;">
                        <button type="submit" class="btn btn-primary btn-magnetic" data-magnetic>Post Comment</button>
                    </div>
                </form>
            </section>


        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
