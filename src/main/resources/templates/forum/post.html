<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title + ' — DPI Community'}">Post — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">

            <a th:href="@{/web/forum/category/{id}(id=${post.categoryId})}"
                class="btn btn-secondary btn-sm btn-magnetic" style="margin-bottom:1rem;" data-magnetic>← Back to
                Category</a>

            <!-- Post -->
            <article class="card glass-card gsap-reveal" style="margin-bottom:2rem;">
                <div class="card-header">
                    <h1 class="card-title kinetic-text text-green" th:text="${post.title}">Title</h1>
                    <div class="card-meta">
                        <span th:text="${post.authorName}">Author</span> •
                        <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}">Date</span>
                    </div>
                </div>
                <div class="card-body" style="white-space: pre-line; line-height: 1.6; color: var(--text);"
                    th:text="${post.content}">Content</div>
                <div class="card-footer" th:if="${post.authorId == currentUserId or isAdmin}"
                    style="gap: 1rem; border-top: 1px solid var(--glass-border-color); padding-top: 1rem;">
                    <a th:href="@{/web/forum/posts/{id}/edit(id=${post.id})}"
                        class="btn btn-secondary btn-sm btn-magnetic" data-magnetic>✏️ Edit Post</a>
                    <form th:action="@{/web/forum/posts/{id}/delete(id=${post.id})}" method="post"
                        onsubmit="return confirm('Delete this post?')">
                        <button type="submit" class="btn btn-danger btn-sm btn-magnetic" data-magnetic>🗑 Delete
                            Post</button>
                    </form>
                </div>
            </article>

            <!-- Comments -->
            <section class="section gsap-reveal">
                <h2 class="section-title kinetic-text">💬 Comments (<span
                        th:text="${comments != null ? comments.size() : 0}">0</span>)</h2>

                <div th:if="${comments != null and !comments.isEmpty()}" class="floating-grid">
                    <div class="card glass-card" th:each="comment : ${comments}" style="margin-bottom:1rem;">
                        <div class="card-body" th:text="${comment.content}" style="color: var(--text-muted);">Comment
                        </div>
                        <div class="card-footer"
                            style="justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.5rem;">
                            <span class="card-meta">
                                <span th:text="${comment.authorName}"
                                    style="color: var(--color-cyber-blue);">Author</span> •
                                <span th:text="${#temporals.format(comment.createdAt, 'dd MMM yyyy HH:mm')}">Date</span>
                            </span>
                            <form th:if="${comment.authorId == currentUserId or isAdmin}"
                                th:action="@{/web/forum/comments/{id}/delete(id=${comment.id})}" method="post"
                                onsubmit="return confirm('Delete this comment?')">
                                <input type="hidden" name="postId" th:value="${post.id}">
                                <button type="submit" class="btn btn-danger btn-sm btn-magnetic"
                                    data-magnetic>🗑</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="card glass-card empty-state" th:if="${comments == null or comments.isEmpty()}"
                    style="margin-bottom: 2rem;">
                    <p>No comments yet. Start the conversation!</p>
                </div>

                <!-- Add Comment -->
                <form th:action="@{/web/forum/posts/{id}/comments(id=${post.id})}" method="post"
                    class="card glass-card gsap-reveal" style="margin-top:2rem;">
                    <div class="form-group">
                        <label class="form-label text-copper">Add a comment</label>
                        <textarea name="content" class="form-control" rows="3" required
                            placeholder="Write your comment..."
                            style="background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.1); color: var(--text);"></textarea>
                    </div>
                    <div style="margin-top: 1rem;">
                        <button type="submit" class="btn btn-primary btn-magnetic" data-magnetic>Post Comment</button>
                    </div>
                </form>
            </section>


        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
