<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title + ' — DPI Community'}">Post — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">

            <a th:href="@{/web/forum}" class="btn btn-secondary btn-sm" style="margin-bottom:1rem;">← Back to Forum</a>

            <!-- Post -->
            <div class="card" style="margin-bottom:2rem;">
                <div class="card-header">
                    <h1 class="card-title" th:text="${post.title}">Title</h1>
                    <span class="card-meta" th:text="${post.createdAt}">Date</span>
                </div>
                <div class="card-body" style="white-space: pre-line;" th:text="${post.content}">Content</div>
                <div class="card-footer" th:if="${post.authorId == currentUserId or isAdmin}">
                    <form th:action="@{/web/forum/posts/{id}/delete(id=${post.id})}" method="post"
                        onsubmit="return confirm('Delete this post?')">
                        <button type="submit" class="btn btn-danger btn-sm">🗑 Delete Post</button>
                    </form>
                </div>
            </div>

            <!-- Comments -->
            <div class="section">
                <h2 class="section-title">💬 Comments (<span
                        th:text="${comments != null ? comments.size() : 0}">0</span>)</h2>

                <div th:if="${comments != null and !comments.isEmpty()}">
                    <div class="card" th:each="comment : ${comments}" style="margin-bottom:0.75rem;">
                        <div class="card-body" th:text="${comment.content}">Comment</div>
                        <div class="card-footer" style="justify-content: space-between;">
                            <span class="card-meta" th:text="${comment.createdAt}">Date</span>
                            <form th:if="${comment.authorId == currentUserId or isAdmin}"
                                th:action="@{/web/forum/comments/{id}/delete(id=${comment.id})}" method="post"
                                onsubmit="return confirm('Delete this comment?')">
                                <input type="hidden" name="postId" th:value="${post.id}">
                                <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Add Comment -->
                <form th:action="@{/web/forum/posts/{id}/comments(id=${post.id})}" method="post" class="card"
                    style="margin-top:1rem;">
                    <div class="form-group">
                        <label class="form-label">Add a comment</label>
                        <textarea name="content" class="form-control" rows="3" required
                            placeholder="Write your comment..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Post Comment</button>
                </form>
            </div>

        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
