<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="kinetic-text">📢 System Broadcasts</h1>
                <div class="actions" sec:authorize="hasRole('ADMINISTRATOR')">
                    <a th:href="@{/web/notices/new}" class="btn btn-magnetic-primary" data-magnetic>+ New Notice</a>
                </div>
            </div>

            <!-- Items per page selector -->
            <div class="pagination-controls" th:if="${noticesPage != null and noticesPage.hasContent()}">
                <form method="get" th:action="@{/web/notices}">
                    <label>Show:</label>
                    <select name="size" onchange="this.form.submit()">
                        <option th:value="10" th:selected="${noticesPage.size == 10}">10</option>
                        <option th:value="20" th:selected="${noticesPage.size == 20}">20</option>
                        <option th:value="50" th:selected="${noticesPage.size == 50}">50</option>
                    </select>
                </form>
            </div>

            <div th:if="${noticesPage != null and noticesPage.hasContent()}" class="floating-grid">
                <div class="card glass-card gsap-reveal" th:each="notice : ${noticesPage.content}"
                    style="margin-bottom:1.5rem; position: relative;"
                    th:styleappend="${notice.isPinned != null and notice.isPinned ? 'border-color: var(--color-cyber-copper); box-shadow: 0 0 15px var(--color-cyber-copper-dim);' : ''}">
                    <div class="card-header">
                        <span class="card-title kinetic-text" th:text="${notice.title}">Title</span>
                        <span class="badge" th:if="${notice.isPinned}"
                            style="background: var(--color-cyber-copper-dim); color: var(--color-cyber-copper); border: 1px solid var(--color-cyber-copper);">📌
                            Pinned</span>

                        <div sec:authorize="hasRole('ADMINISTRATOR')"
                            style="margin-left:auto; display:flex; gap:0.5rem;">
                            <a th:href="@{/web/notices/{id}/edit(id=${notice.id})}" class="btn btn-sm btn-ghost"
                                style="opacity: 0.7;">Edit</a>
                            <form th:action="@{/web/notices/{id}/delete(id=${notice.id})}" method="post"
                                onsubmit="return confirm('Delete this notice?')" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-ghost"
                                    style="color: #ff6b6b; opacity: 0.7;">🗑</button>
                            </form>
                        </div>
                    </div>
                    <div class="card-body text-muted" style="white-space:pre-line;" th:text="${notice.content}">Content
                    </div>
                </div>


            </div>
            <!-- Pagination -->
            <div class="pagination" th:if="${noticesPage.totalPages > 1}"
                style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
                <a th:if="${noticesPage.number > 0}"
                    th:href="@{/web/notices(page=${noticesPage.number - 1},size=${noticesPage.size})}"
                    class="btn-magnetic">← Previous</a>
                <span class="glass-card" style="padding: 0.5rem 1rem; align-self: center;"
                    th:text="${noticesPage.number + 1 + ' / ' + noticesPage.totalPages}">1/1</span>
                <a th:if="${noticesPage.number < noticesPage.totalPages - 1}"
                    th:href="@{/web/notices(page=${noticesPage.number + 1},size=${noticesPage.size})}"
                    class="btn-magnetic">Next →</a>
            </div>
            <div class="empty-state" th:if="${noticesPage == null or !noticesPage.hasContent()}">
                <div class="empty-icon">📢</div>
                <p>No active notices at the moment.</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
