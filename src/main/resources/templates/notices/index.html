<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="kinetic-text">📢 System Broadcasts</h1>
                <div class="actions" sec:authorize="hasRole('ADMINISTRATOR')">
                    <a th:href="@{/web/notices/new}" class="btn btn-magnetic-primary" data-magnetic>+ New Notice</a>
                </div>
            </div>

            <div th:if="${notices != null and !notices.isEmpty()}" class="floating-grid">
                <div class="card glass-card gsap-reveal" th:each="notice : ${notices}"
                    style="margin-bottom:1.5rem; position: relative;"
                    th:styleappend="${notice.isPinned != null and notice.isPinned ? 'border-color: var(--color-cyber-copper); box-shadow: 0 0 15px var(--color-cyber-copper-dim);' : ''}">
                    <div class="card-header">
                        <span class="card-title kinetic-text" th:text="${notice.title}">Title</span>
                        <span class="badge" th:if="${notice.isPinned}"
                            style="background: var(--color-cyber-copper-dim); color: var(--color-cyber-copper); border: 1px solid var(--color-cyber-copper);">📌
                            Pinned</span>

                        <div sec:authorize="hasRole('ADMINISTRATOR')"
                            style="margin-left:auto; display:flex; gap:0.5rem;">
                            <a th:href="@{/web/notices/{id}/edit(id=${notice.id})}" class="btn btn-sm btn-ghost"
                                style="opacity: 0.7;">Edit</a>
                            <form th:action="@{/web/notices/{id}/delete(id=${notice.id})}" method="post"
                                onsubmit="return confirm('Delete this notice?')" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-ghost"
                                    style="color: #ff6b6b; opacity: 0.7;">🗑</button>
                            </form>
                        </div>
                    </div>
                    <div class="card-body text-muted" style="white-space:pre-line;" th:text="${notice.content}">Content
                    </div>
                </div>
            </div>
            <div class="empty-state" th:if="${notices == null or notices.isEmpty()}">
                <div class="empty-icon">📢</div>
                <p>No active notices at the moment.</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
