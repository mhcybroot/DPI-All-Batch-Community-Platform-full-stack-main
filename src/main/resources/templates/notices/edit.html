<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Notice — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>✏️ Edit Notice</h1>
            </div>
            <form th:action="@{/web/notices/{id}/edit(id=${notice.id})}" method="post" class="card"
                style="max-width:600px;">
                <div class="form-group"><label class="form-label">Title</label><input type="text" name="title"
                        class="form-control" th:value="${notice.title}" required></div>
                <div class="form-group"><label class="form-label">Content</label><textarea name="content"
                        class="form-control" rows="6" th:text="${notice.content}"></textarea></div>
                <div class="form-group"><label><input type="checkbox" name="isPinned" value="true"
                            th:checked="${notice.isPinned}"> Pin this notice</label></div>
                <div class="form-group"><label class="form-label">Expires At</label><input type="datetime-local"
                        name="expiresAt" class="form-control" th:value="${notice.expiresAt}"></div>
                <div style="display:flex;gap:0.75rem;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/web/notices}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
