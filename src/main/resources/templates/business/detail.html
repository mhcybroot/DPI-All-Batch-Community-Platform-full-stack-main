<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${business.businessName + ' — DPI Business'}">Business — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <a th:href="@{/web/business}" class="btn btn-magnetic btn-sm gsap-reveal" data-magnetic
                style="margin-bottom:1.5rem;">← Sector Index</a>

            <div class="card glass-card gsap-reveal" style="padding: 2.5rem;">
                <div class="card-header"
                    style="border-bottom: 1px solid var(--color-glass-border); padding-bottom: 1.5rem; margin-bottom: 2rem;">
                    <h1 class="kinetic-text" th:text="${business.businessName}"
                        style="font-size: 2.5rem; color: var(--color-moss-emerald);">Business Name</h1>
                    <div style="margin-top: 0.5rem;">
                        <span class="badge"
                            style="background: var(--color-cyber-copper-dim); color: var(--color-cyber-copper); border: 1px solid var(--color-cyber-copper-dim);"
                            th:text="${business.category}">Category</span>
                    </div>
                </div>

                <div class="card-body">
                    <div class="grid grid-2" style="gap: 2rem; margin-bottom: 2.5rem;">
                        <div class="data-node">
                            <strong
                                style="display: block; font-family: var(--font-machine); font-size: 0.75rem; color: var(--color-silicon-gray); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Sector
                                ID</strong>
                            <p th:text="${business.category}" style="font-size: 1.1rem;">Category</p>
                        </div>
                        <div class="data-node">
                            <strong
                                style="display: block; font-family: var(--font-machine); font-size: 0.75rem; color: var(--color-silicon-gray); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Geographic
                                Node</strong>
                            <p th:text="${business.location}" style="font-size: 1.1rem;">Location</p>
                        </div>
                    </div>

                    <div style="margin-bottom: 2.5rem;">
                        <strong
                            style="display: block; font-family: var(--font-machine); font-size: 0.75rem; color: var(--color-silicon-gray); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem;">Protocol
                            Description</strong>
                        <p th:if="${business.description}"
                            style="white-space:pre-line; color: var(--text-muted); line-height: 1.8;"
                            th:text="${business.description}">Description</p>
                    </div>

                    <div th:if="${business.website}"
                        style="padding-top: 1.5rem; border-top: 1px solid var(--color-glass-border);">
                        <a th:href="${business.website}" target="_blank" rel="noopener" class="btn btn-magnetic-primary"
                            data-magnetic>
                            🌐 External Uplink Established ↗
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
