<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${business.businessName + ' — DPI Business'}">Business — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <a th:href="@{/web/business}" class="btn btn-secondary btn-sm" style="margin-bottom:1rem;">← Back</a>
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title" th:text="${business.businessName}">Name</h1>
                </div>
                <div class="card-body">
                    <div class="grid grid-2" style="margin-bottom:1rem;">
                        <div><strong>📂 Category</strong>
                            <p th:text="${business.category}">Category</p>
                        </div>
                        <div><strong>📍 Location</strong>
                            <p th:text="${business.location}">Location</p>
                        </div>
                    </div>
                    <p th:if="${business.description}" style="white-space:pre-line;" th:text="${business.description}">
                        Desc</p>
                    <p th:if="${business.website}" style="margin-top:0.5rem;"><a th:href="${business.website}"
                            target="_blank">🌐 Visit Website</a></p>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
