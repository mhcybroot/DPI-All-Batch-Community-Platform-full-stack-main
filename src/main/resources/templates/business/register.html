<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Business — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header gsap-reveal">
                <h1 class="kinetic-text">🏢 Entity Registration</h1>
                <p class="text-muted" style="margin-top: 0.5rem;">Initiate a new corporate node within the DPI network.
                </p>
            </div>

            <form th:action="@{/web/business}" method="post" class="card glass-card gsap-reveal"
                style="max-width:700px; padding: 2.5rem;">
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label class="form-label">Business Identifier</label>
                    <input type="text" name="businessName" class="form-control glass-input" required
                        placeholder="Legal entity name...">
                </div>

                <div class="grid grid-2" style="gap: 1.5rem; margin-bottom: 2rem;">
                    <div class="form-group">
                        <label class="form-label">Industry Classification</label>
                        <input type="text" name="industry" class="form-control glass-input" required
                            placeholder="e.g. IT Services, Logistics">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Geographic Node</label>
                        <input type="text" name="location" class="form-control glass-input" placeholder="City, Region">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label class="form-label">Operational Logic (Description)</label>
                    <textarea name="description" class="form-control glass-input" rows="5"
                        placeholder="Detail the entity's core functions and objectives..."></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 2.5rem;">
                    <label class="form-label">Digital Access Port (Website URL)</label>
                    <input type="url" name="website" class="form-control glass-input"
                        placeholder="https://external-uplink.com">
                </div>

                <div
                    style="display:flex; gap:1rem; align-items: center; border-top: 1px solid var(--color-glass-border); padding-top: 2rem;">
                    <button type="submit" class="btn btn-magnetic-primary" data-magnetic>Commit Registration</button>
                    <a th:href="@{/web/business}" class="btn btn-magnetic" data-magnetic>Abort Protocol</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
