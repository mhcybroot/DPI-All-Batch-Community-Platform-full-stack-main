<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Directory — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="kinetic-text">🏢 Corporate Directory</h1>
                <div class="actions">
                    <a th:href="@{/web/business/register}" class="btn btn-magnetic-primary" data-magnetic>+ Register
                        Entity</a>
                    <a th:href="@{/web/business/my-business}" class="btn btn-magnetic" data-magnetic>My Assets</a>
                </div>
            </div>

            <div class="card glass-card gsap-reveal" style="margin-bottom:2rem; padding: 1rem;">
                <form style="position: relative;">
                    <span
                        style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); opacity: 0.5;">🔍</span>
                    <input type="text" name="search" class="form-control glass-input"
                        placeholder="Query Corporate Database..." th:value="${search}" hx-get="/web/business"
                        hx-target="body" hx-trigger="keyup changed delay:300ms" hx-push-url="true"
                        style="padding-left: 2.5rem;">
                </form>
            </div>

            <div th:if="${businessPage != null and businessPage.hasContent()}" class="grid grid-3 floating-grid">
                <a th:each="biz : ${businessPage.content}" th:href="@{/web/business/{id}(id=${biz.id})}"
                    class="card glass-card gsap-reveal"
                    style="text-decoration:none; color:inherit; transition: transform 0.3s ease;" data-magnetic>
                    <div class="card-header">
                        <span class="card-title kinetic-text" th:text="${biz.businessName}">Name</span>
                    </div>
                    <div class="card-body">
                        <div style="margin-bottom: 0.5rem;">
                            <span class="badge"
                                style="background: var(--color-cyber-copper-dim); color: var(--color-cyber-copper); border: 1px solid var(--color-cyber-copper-dim);"
                                th:text="${biz.category}">Category</span>
                        </div>
                        <div class="card-meta"
                            style="font-family: var(--font-machine); color: var(--color-silicon-gray);">
                            <span style="margin-right: 0.5rem;">📍</span> <span
                                th:text="${biz.location}">Location</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="empty-state glass-card gsap-reveal"
                th:if="${businessPage == null or !businessPage.hasContent()}">
                <div class="empty-icon" style="filter: drop-shadow(0 0 10px var(--color-cyber-copper));">🏢</div>
                <p class="text-muted">No corporate entities found in this sector.</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
