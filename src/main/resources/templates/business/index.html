<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Directory — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>🏪 Business Directory</h1>
                <div class="actions">
                    <a th:href="@{/web/business/register}" class="btn btn-primary">+ Register Business</a>
                    <a th:href="@{/web/business/my-business}" class="btn btn-secondary">My Businesses</a>
                </div>
            </div>
            <div class="card" style="margin-bottom:1.5rem;">
                <form><input type="text" name="search" class="form-control" placeholder="Search businesses..."
                        th:value="${search}" hx-get="/web/business" hx-target="body"
                        hx-trigger="keyup changed delay:300ms" hx-push-url="true"></form>
            </div>
            <div th:if="${businessPage != null and businessPage.hasContent()}" class="grid grid-3">
                <a th:each="biz : ${businessPage.content}" th:href="@{/web/business/{id}(id=${biz.id})}" class="card"
                    style="text-decoration:none;color:inherit;">
                    <div class="card-header"><span class="card-title" th:text="${biz.businessName}">Name</span></div>
                    <div class="card-body">
                        <p th:text="${biz.category}">Category</p>
                        <p class="card-meta" th:text="${biz.location}">Location</p>
                    </div>
                </a>
            </div>
            <div class="empty-state" th:if="${businessPage == null or !businessPage.hasContent()}">
                <div class="empty-icon">🏪</div>
                <p>No businesses registered yet.</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
