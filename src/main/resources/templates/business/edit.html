<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Business — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>✏️ Edit Business Profile</h1>
            </div>
            <form th:action="@{/web/business/{id}/edit(id=${business.id})}" method="post" class="card"
                style="max-width:600px;">
                <div class="form-group"><label class="form-label">Business Name</label><input type="text"
                        name="businessName" class="form-control" th:value="${business.businessName}" required></div>
                <div class="form-group"><label class="form-label">Tagline</label><input type="text" name="tagline"
                        class="form-control" th:value="${business.tagline}"></div>
                <div class="form-group"><label class="form-label">Industry</label><input type="text" name="industry"
                        class="form-control" th:value="${business.industry}"></div>
                <div class="form-group"><label class="form-label">Description</label><textarea name="description"
                        class="form-control" rows="4" th:text="${business.description}"></textarea></div>
                <div class="form-group"><label class="form-label">Website</label><input type="url" name="website"
                        class="form-control" th:value="${business.website}"></div>
                <div class="form-group"><label class="form-label">Location</label><input type="text" name="location"
                        class="form-control" th:value="${business.location}"></div>
                <div class="form-group"><label class="form-label">Logo URL</label><input type="url" name="logoUrl"
                        class="form-control" th:value="${business.logoUrl}"></div>
                <div class="form-group"><label class="form-label">Established Date</label><input type="date"
                        name="establishedDate" class="form-control" th:value="${business.establishedDate}"></div>
                <div style="display:flex;gap:0.75rem;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/web/business/{id}(id=${business.id})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
