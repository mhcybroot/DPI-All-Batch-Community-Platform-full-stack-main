<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Directory — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>🔍 Member Directory</h1>
                <p>Search for batchmates by name or bio.</p>
            </div>

            <div class="card" style="margin-bottom:1.5rem;">
                <form>
                    <input type="text" name="query" class="form-control" placeholder="Type a name or keyword..."
                        th:value="${query}" hx-get="/web/directory/search" hx-target="#results"
                        hx-trigger="keyup changed delay:300ms" hx-include="this" hx-swap="innerHTML">
                </form>
            </div>

            <div class="card" style="margin-bottom:1.5rem;">
                <div class="card-header"><span class="card-title">🔎 Advanced Filters</span></div>
                <div class="card-body">
                    <form th:action="@{/web/directory/filter}" method="get"
                        style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:flex-end;">
                        <div class="form-group" style="flex:1; min-width:150px;">
                            <label class="form-label">Skill</label>
                            <input type="text" name="skill" class="form-control" placeholder="e.g. Java, Python"
                                th:value="${filterSkill}">
                        </div>
                        <div class="form-group" style="flex:1; min-width:150px;">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control" placeholder="e.g. Dhaka"
                                th:value="${filterLocation}">
                        </div>
                        <div class="form-group" style="flex:1; min-width:150px;">
                            <label class="form-label">Employment</label>
                            <select name="employmentStatus" class="form-control">
                                <option value="">All</option>
                                <option value="EMPLOYED" th:selected="${filterEmploymentStatus == 'EMPLOYED'}">Employed
                                </option>
                                <option value="UNEMPLOYED" th:selected="${filterEmploymentStatus == 'UNEMPLOYED'}">
                                    Unemployed</option>
                                <option value="STUDENT" th:selected="${filterEmploymentStatus == 'STUDENT'}">Student
                                </option>
                                <option value="FREELANCER" th:selected="${filterEmploymentStatus == 'FREELANCER'}">
                                    Freelancer</option>
                            </select>
                        </div>
                        <div style="display:flex; gap:0.5rem;">
                            <button type="submit" class="btn btn-primary btn-sm">Filter</button>
                            <a th:href="@{/web/directory}" class="btn btn-secondary btn-sm">Clear</a>
                        </div>
                    </form>
                </div>
            </div>

            <div id="results">
                <div th:if="${results != null and !results.isEmpty()}" class="grid grid-3">
                    <div class="card" th:each="profile : ${results}">
                        <div class="card-header">
                            <span class="card-title" th:text="${profile.fullName ?: 'Member'}">Name</span>
                        </div>
                        <div class="card-body">
                            <p th:if="${profile.bio}" th:text="${profile.bio}" style="margin-bottom:0.5rem;"></p>
                            <div class="tag-list" th:if="${profile.skills != null}">
                                <span class="tag" th:each="skill : ${profile.skills}"
                                    th:text="${skill.name}">Skill</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="empty-state" th:if="${results != null and results.isEmpty()}">
                    <p>No members found matching your criteria.</p>
                </div>
                <div class="empty-state" th:if="${results == null}">
                    <div class="empty-icon">🔍</div>
                    <p>Start typing to search or use the filters above</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
