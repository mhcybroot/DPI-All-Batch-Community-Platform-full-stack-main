<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Poll — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>📊 Create New Poll</h1>
            </div>
            <form th:action="@{/web/polls}" method="post" class="card" style="max-width:600px;" id="pollForm">
                <div class="form-group"><label class="form-label">Question</label><input type="text" name="question"
                        class="form-control" required placeholder="What would you like to ask?"></div>
                <div class="form-group"><label class="form-label">Event ID (optional)</label><input type="number"
                        name="eventId" class="form-control" placeholder="Leave blank for standalone poll"></div>
                <div class="form-group">
                    <label class="form-label">Options</label>
                    <div id="optionsContainer">
                        <div style="margin-bottom:0.5rem;display:flex;gap:0.5rem;"><input type="text" name="options"
                                class="form-control" required placeholder="Option 1"></div>
                        <div style="margin-bottom:0.5rem;display:flex;gap:0.5rem;"><input type="text" name="options"
                                class="form-control" required placeholder="Option 2"></div>
                    </div>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="addOption()">+ Add Option</button>
                </div>
                <div class="form-group" style="display:flex;gap:1.5rem;">
                    <label><input type="checkbox" name="multipleChoice" value="true"> Allow multiple votes</label>
                    <label><input type="checkbox" name="anonymous" value="true"> Anonymous voting</label>
                </div>
                <div style="display:flex;gap:0.75rem;">
                    <button type="submit" class="btn btn-primary">Create Poll</button>
                    <a th:href="@{/web/polls}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
    <script>
        let optionCount = 2;
        function addOption() {
            optionCount++;
            const container = document.getElementById('optionsContainer');
            const div = document.createElement('div');
            div.style.cssText = 'margin-bottom:0.5rem;display:flex;gap:0.5rem;';
            div.innerHTML = '<input type="text" name="options" class="form-control" required placeholder="Option ' + optionCount + '">' +
                '<button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">✕</button>';
            container.appendChild(div);
        }
    </script>
</body>

</html>
