<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Poll — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="kinetic-text">📊 Create Consensus Node</h1>
            </div>

            <form th:action="@{/web/polls}" method="post" class="card glass-card gsap-reveal"
                style="max-width:700px; padding: 2rem;" id="pollForm">
                <div class="form-group">
                    <label class="form-label text-muted">Core Question</label>
                    <input type="text" name="question" class="form-control glass-input" required
                        placeholder="Define the variable to be resolved..."
                        style="font-size: 1.1rem; border-color: var(--color-neural-cyan);">
                </div>

                <div class="form-group">
                    <label class="form-label text-muted">Linked Event ID (Optional)</label>
                    <select name="eventId" class="form-control glass-input" style="color: var(--color-frozen-white);">
                        <option value="" selected>-- Associate with an event node --</option>
                        <option th:each="event : ${upcomingEvents}" th:value="${event.id}"
                            th:text="${event.title + ' (' + #temporals.format(event.eventDate, 'MMM dd') + ')'}">
                        </option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 2rem;">
                    <label class="form-label text-muted"
                        style="border-bottom: 1px solid var(--color-glass-border); display: block; padding-bottom: 0.5rem; margin-bottom: 1rem;">Response
                        Options</label>

                    <div id="optionsContainer">
                        <!-- Initial Option 01 -->
                        <div class="option-row"
                            style="margin-bottom:1rem; display:flex; gap:0.5rem; align-items: center;">
                            <span class="mono-text"
                                style="width: 30px; color: var(--color-moss-emerald); font-weight: bold;">01</span>
                            <input type="text" name="options" class="form-control glass-input" required
                                placeholder="Option Alpha" style="flex:1;">
                            <button type="button" class="btn btn-sm btn-ghost"
                                style="opacity: 0; pointer-events: none;">✕</button> <!-- Spacer for alignment -->
                        </div>
                        <!-- Initial Option 02 -->
                        <div class="option-row"
                            style="margin-bottom:1rem; display:flex; gap:0.5rem; align-items: center;">
                            <span class="mono-text"
                                style="width: 30px; color: var(--color-moss-emerald); font-weight: bold;">02</span>
                            <input type="text" name="options" class="form-control glass-input" required
                                placeholder="Option Beta" style="flex:1;">
                            <button type="button" class="btn btn-sm btn-ghost text-danger" onclick="removeOption(this)"
                                title="Remove Option">✕</button>
                        </div>
                    </div>

                    <button type="button" class="btn btn-secondary btn-magnetic" onclick="addOption()" data-magnetic
                        style="width: 100%; border-style: dashed; opacity: 0.7;">
                        + Append Option Node
                    </button>
                </div>

                <div class="form-group"
                    style="display:flex; gap:2rem; margin-top: 1.5rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--color-glass-border);">
                    <label class="checkbox-container"
                        style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="multipleChoice" value="true"
                            style="accent-color: var(--color-neural-cyan);">
                        <span class="text-muted">Allow Multiple Vectors</span>
                    </label>
                    <label class="checkbox-container"
                        style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="anonymous" value="true"
                            style="accent-color: var(--color-neural-cyan);">
                        <span class="text-muted">Anonymous Protocol</span>
                    </label>
                </div>

                <div style="display:flex; gap:1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary btn-magnetic" data-magnetic>Initialize Poll</button>
                    <a th:href="@{/web/polls}" class="btn btn-secondary btn-magnetic" data-magnetic>Abort</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
    <script>
        function addOption() {
            const container = document.getElementById('optionsContainer');
            const newIndex = container.children.length + 1;
            const div = document.createElement('div');
            div.className = 'option-row gsap-reveal';
            div.style.cssText = 'margin-bottom:1rem; display:flex; gap:0.5rem; align-items: center;';

            div.innerHTML = `
                <span class="mono-text" style="width: 30px; color: var(--color-moss-emerald); font-weight: bold;">${String(newIndex).padStart(2, '0')}</span>
                <input type="text" name="options" class="form-control glass-input" required placeholder="Option ${String.fromCharCode(64 + newIndex)}" style="flex:1;">
                <button type="button" class="btn btn-sm btn-ghost text-danger" onclick="removeOption(this)" title="Remove Option">✕</button>
            `;

            container.appendChild(div);

            // Re-initialize magnetic buttons if needed (though these are just inputs)
        }

        function removeOption(btn) {
            const row = btn.closest('.option-row');
            const container = document.getElementById('optionsContainer');

            // Don't allow removing if only 2 options left
            if (container.children.length <= 2) {
                alert("Minimum 2 options required.");
                return;
            }

            row.remove();
            renumberOptions();
        }

        function renumberOptions() {
            const container = document.getElementById('optionsContainer');
            Array.from(container.children).forEach((row, index) => {
                const span = row.querySelector('.mono-text');
                if (span) span.innerText = String(index + 1).padStart(2, '0');
            });
        }

        if (typeof initMagneticButtons === 'function') {
            initMagneticButtons();
        }
    </script>
</body>

</html>
