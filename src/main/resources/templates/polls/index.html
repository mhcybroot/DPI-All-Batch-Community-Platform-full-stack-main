<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polls — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="kinetic-text">📊 Consensus Protocol</h1>
                <div class="actions">
                    <a th:href="@{/web/polls/create}" class="btn btn-magnetic-primary" data-magnetic>+ Initiate Poll</a>
                </div>
            </div>

            <div th:if="${polls != null and !polls.isEmpty()}" class="grid grid-2 floating-grid">
                <a th:each="poll : ${polls}" th:href="@{/web/polls/{id}(id=${poll.id})}"
                    class="card glass-card gsap-reveal"
                    style="text-decoration:none; color:inherit; transition: transform 0.3s ease;" data-magnetic>
                    <div class="card-header">
                        <span class="card-title kinetic-text" th:text="${poll.question}">Question</span>
                    </div>
                    <div class="card-body">
                        <div class="card-meta"
                            style="color: var(--color-moss-emerald); font-family: var(--font-machine);">
                            <span
                                th:text="${poll.options != null ? poll.options.size() + ' Options Configured' : 'No Options'}">Options</span>
                        </div>
                        <div class="text-muted" style="font-size: 0.85rem; margin-top: 0.5rem;">
                            Status: <span style="color: var(--color-cyber-copper);">Active</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="empty-state glass-card gsap-reveal" th:if="${polls == null or polls.isEmpty()}">
                <div class="empty-icon" style="filter: drop-shadow(0 0 10px var(--color-moss-emerald));">📊</div>
                <p class="text-muted">Consensus Module Offline. No active polls found.</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
