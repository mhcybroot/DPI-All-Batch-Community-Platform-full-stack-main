<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorship — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="kinetic-text">🤝 Neural Uplink</h1>
                <div class="actions">
                    <a th:href="@{/web/mentorship/register}" class="btn btn-magnetic-primary" data-magnetic>Become a
                        Mentor</a>
                    <a th:href="@{/web/mentorship/requests}" class="btn btn-magnetic" data-magnetic>My Requests</a>
                </div>
            </div>

            <div class="card glass-card gsap-reveal" style="margin-bottom:1.5rem; padding: 1.5rem;">
                <form style="display:flex; gap:1rem; align-items: center;">
                    <input type="text" name="expertise" class="form-control glass-input"
                        placeholder="Search neural expertise..." th:value="${expertise}"
                        style="flex-grow: 1; max-width:500px;">
                    <button type="submit" class="btn btn-magnetic" data-magnetic>Search</button>
                </form>
            </div>

            <div th:if="${mentorsPage != null and mentorsPage.hasContent()}" class="grid grid-3 floating-grid">
                <div class="card glass-card gsap-reveal" th:each="mentor : ${mentorsPage.content}" data-magnetic
                    style="position: relative;">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="card-title kinetic-text" th:text="${mentor.user.name ?: 'Mentor'}">Name</span>
                            <span th:if="${mentor.user.id == currentUserId}" class="badge bg-info">It's You</span>
                        </div>
                    </div>
                    <div class="card-body text-muted">
                        <p th:if="${mentor.expertise}">
                            <span style="color: var(--color-moss-emerald);">⚡ Expertise:</span>
                            <span th:text="${mentor.expertise}">Expertise</span>
                        </p>
                    </div>
                    <div class="card-footer" th:if="${mentor.user.id != currentUserId}"
                        style="border-top: 1px solid var(--color-glass-border); padding-top: 1rem; margin-top: auto;">
                        <form th:action="@{/web/mentorship/connect}" method="post" style="display: flex; gap: 0.5rem;">
                            <input type="hidden" name="mentorId" th:value="${mentor.user.id}">
                            <input type="text" name="message" class="form-control glass-input"
                                placeholder="Introduce yourself..." style="flex-grow: 1; font-size: 0.85rem;">
                            <button type="submit" class="btn btn-sm btn-magnetic-primary">Connect</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="empty-state glass-card gsap-reveal" th:if="${mentorsPage == null or !mentorsPage.hasContent()}">
                <div class="empty-icon" style="filter: drop-shadow(0 0 10px var(--color-cyber-copper));">🤝</div>
                <p class="text-muted">Neural Network Unpopulated. Be the first node to register!</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
