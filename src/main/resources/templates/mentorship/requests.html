<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentorship Requests — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>📋 My Mentorship Requests</h1>
                <div class="actions"><a th:href="@{/web/mentorship}" class="btn btn-secondary">← Back to Mentors</a>
                </div>
            </div>

            <div class="grid grid-2">
                <!-- Sent Requests -->
                <div class="section">
                    <h2 class="section-title">📤 Sent Requests</h2>
                    <div th:if="${myRequests != null and !myRequests.isEmpty()}">
                        <div class="card" th:each="req : ${myRequests}" style="margin-bottom:0.75rem;">
                            <div class="card-body">
                                <p><strong>Mentor:</strong> <span th:text="${req.mentor.name ?: 'Mentor'}">Name</span>
                                </p>
                                <p th:if="${req.requestMessage}" class="card-meta" th:text="${req.requestMessage}">
                                    Message</p>
                            </div>
                            <div class="card-footer">
                                <span class="badge"
                                    th:classappend="${req.status.name() == 'ACTIVE' ? 'badge-success' : (req.status.name() == 'REJECTED' ? 'badge-danger' : 'badge-warning')}"
                                    th:text="${req.status}">Status</span>
                            </div>
                        </div>
                    </div>
                    <div class="card empty-state" th:if="${myRequests == null or myRequests.isEmpty()}">
                        <p>No sent requests.</p>
                    </div>
                </div>

                <!-- Incoming Requests -->
                <div class="section">
                    <h2 class="section-title">📥 Incoming Requests</h2>
                    <div th:if="${incomingRequests != null and !incomingRequests.isEmpty()}">
                        <div class="card" th:each="req : ${incomingRequests}" style="margin-bottom:0.75rem;">
                            <div class="card-body">
                                <p><strong>From:</strong> <span th:text="${req.mentee.name ?: 'Member'}">Name</span></p>
                                <p th:if="${req.requestMessage}" class="card-meta" th:text="${req.requestMessage}">
                                    Message</p>
                            </div>
                            <div class="card-footer" th:if="${req.status.name() == 'PENDING'}">
                                <form th:action="@{/web/mentorship/requests/{id}/update(id=${req.id})}" method="post"
                                    style="display:inline;">
                                    <input type="hidden" name="status" value="ACTIVE">
                                    <button class="btn btn-success btn-sm" type="submit">✓ Accept</button>
                                </form>
                                <form th:action="@{/web/mentorship/requests/{id}/update(id=${req.id})}" method="post"
                                    style="display:inline;">
                                    <input type="hidden" name="status" value="REJECTED">
                                    <button class="btn btn-danger btn-sm" type="submit">✕ Decline</button>
                                </form>
                            </div>
                            <div class="card-footer" th:if="${req.status.name() != 'PENDING'}">
                                <span class="badge"
                                    th:classappend="${req.status.name() == 'ACTIVE' ? 'badge-success' : 'badge-danger'}"
                                    th:text="${req.status}">Status</span>
                            </div>
                        </div>
                    </div>
                    <div class="card empty-state" th:if="${incomingRequests == null or incomingRequests.isEmpty()}">
                        <p>No incoming requests.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
