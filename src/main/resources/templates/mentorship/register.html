<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Mentor — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>🤝 Become a Mentor</h1>
            </div>
            <form th:action="@{/web/mentorship/register}" method="post" class="card" style="max-width:600px;">
                <div class="form-group"><label class="form-label">Expertise Areas</label><input type="text"
                        name="expertise" class="form-control" required
                        placeholder="e.g. Java, System Design, Career Guidance"></div>

                <div class="form-group"><label class="form-label">Max Mentees</label><input type="number"
                        name="maxMentees" class="form-control" min="1" max="20" value="5"></div>
                <div style="display:flex;gap:0.75rem;"><button type="submit" class="btn btn-primary">Register</button><a
                        th:href="@{/web/mentorship}" class="btn btn-secondary">Cancel</a></div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
