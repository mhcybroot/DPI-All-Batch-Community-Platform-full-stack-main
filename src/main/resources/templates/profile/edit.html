<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="kinetic-text">✏ Edit Identity Protocol</h1>
            </div>

            <form th:action="@{/web/profile/edit}" method="post" class="card glass-card gsap-reveal"
                style="max-width:700px; padding: 2rem;">
                <div class="form-group">
                    <label class="form-label text-muted">Bio-Data Narrative</label>
                    <textarea name="bio" class="form-control glass-input" th:text="${profile.bio}" rows="3"
                        placeholder="Enter your system description..."></textarea>
                </div>
                <div class="grid grid-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label text-muted">Date of Origin</label>
                        <input type="date" name="dateOfBirth" class="form-control glass-input"
                            th:value="${profile.dateOfBirth}">
                    </div>
                    <div class="form-group">
                        <label class="form-label text-muted">Comms Link (Phone)</label>
                        <input type="text" name="phoneNumber" class="form-control glass-input"
                            th:value="${profile.phoneNumber}" placeholder="+880...">
                    </div>
                </div>

                <h3
                    style="margin-top: 1.5rem; margin-bottom: 1rem; font-size: 1.1rem; color: var(--color-silicon-gray);">
                    External Uplinks</h3>

                <div class="form-group">
                    <label class="form-label text-muted">LinkedIn Signal</label>
                    <input type="url" name="linkedinUrl" class="form-control glass-input"
                        th:value="${profile.linkedinUrl}" placeholder="https://linkedin.com/in/...">
                </div>
                <div class="form-group">
                    <label class="form-label text-muted">GitHub Repository</label>
                    <input type="url" name="githubUrl" class="form-control glass-input" th:value="${profile.githubUrl}"
                        placeholder="https://github.com/...">
                </div>
                <div class="form-group">
                    <label class="form-label text-muted">Portfolio Domain</label>
                    <input type="url" name="portfolioUrl" class="form-control glass-input"
                        th:value="${profile.portfolioUrl}" placeholder="https://...">
                </div>

                <div style="display:flex; gap:1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-magnetic-primary" data-magnetic>Save Protocol</button>
                    <a th:href="@{/web/profile}" class="btn btn-magnetic" data-magnetic>Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
