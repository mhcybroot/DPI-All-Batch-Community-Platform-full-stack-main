<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="empty-state" style="padding:4rem 0;">
                <div class="empty-icon" style="font-size:4rem;"
                    th:text="${status == 404 ? '🔍' : (status == 403 ? '🔒' : '⚠️')}">⚠️</div>
                <h1 th:text="${status ?: 'Error'}">Error</h1>
                <p th:text="${error ?: 'Something went wrong.'}">Something went wrong.</p>
                <p th:if="${message}" class="card-meta" th:text="${message}">Details</p>
                <a th:href="@{/web/dashboard}" class="btn btn-primary" style="margin-top:1.5rem;">← Back to
                    Dashboard</a>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI CST Community Platform</p>
        </div>
    </footer>
</body>

</html>
