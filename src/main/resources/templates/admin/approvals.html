<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — User Approvals — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="alert alert-success" data-auto-dismiss>✓ <span th:text="${successMessage}"></span></div>
    </div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="kinetic-text">⚙ System Administration</h1>
                <div class="actions">
                    <a th:href="@{/web/admin/approvals}" class="btn btn-magnetic-primary" data-magnetic>Pending
                        Approvals</a>
                    <a th:href="@{/web/admin/users}" class="btn btn-magnetic" data-magnetic>👥 All Users</a>
                    <a th:href="@{/web/admin/users/create}" class="btn btn-magnetic" data-magnetic>+ Create User
                        Node</a>
                    <a th:href="@{/web/admin/audit-logs}" class="btn btn-magnetic" data-magnetic>Audit Logs</a>
                </div>
            </div>

            <div th:if="${requests != null and !requests.isEmpty()}" class="card glass-card gsap-reveal"
                style="padding: 0;">
                <div class="table-wrapper" style="margin: 0;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead style="background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--color-glass-border);">
                            <tr>
                                <th style="padding: 1rem; text-align: left; color: var(--color-silicon-gray);">ID</th>
                                <th style="padding: 1rem; text-align: left; color: var(--color-silicon-gray);">User
                                    Identity</th>
                                <th style="padding: 1rem; text-align: left; color: var(--color-silicon-gray);">Comms
                                    Link</th>
                                <th style="padding: 1rem; text-align: left; color: var(--color-silicon-gray);">Timestamp
                                </th>
                                <th style="padding: 1rem; text-align: left; color: var(--color-silicon-gray);">Protocol
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="req : ${requests}" style="border-bottom: 1px solid var(--color-glass-border);">
                                <td th:text="${req.id}" style="padding: 1rem; color: var(--color-moss-emerald);">1</td>
                                <td th:text="${req.user.fullName ?: 'User'}" style="padding: 1rem; font-weight: 500;">
                                    Name</td>
                                <td th:text="${req.user.email ?: '—'}" style="padding: 1rem; font-family: monospace;">
                                    Email</td>
                                <td th:text="${req.requestedAt}"
                                    style="padding: 1rem; color: var(--color-silicon-gray); font-size: 0.9rem;">Date
                                </td>
                                <td style="padding: 1rem; display:flex; gap:0.5rem;">
                                    <form th:action="@{/web/admin/approvals/{id}/approve(id=${req.id})}" method="post">
                                        <button class="btn btn-sm" type="submit"
                                            style="background: rgba(45, 90, 39, 0.2); color: #4caf50; border: 1px solid rgba(76, 175, 80, 0.3);">✓
                                            Authorize</button>
                                    </form>
                                    <form th:action="@{/web/admin/approvals/{id}/reject(id=${req.id})}" method="post"
                                        style="display:flex; gap:0.25rem;">
                                        <input type="text" name="reason" class="form-control glass-input"
                                            placeholder="Denial Reason"
                                            style="max-width:150px; padding:0.25rem 0.5rem; font-size:0.8125rem; height: auto;">
                                        <button class="btn btn-sm" type="submit"
                                            style="background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.2);">✕
                                            Deny</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="empty-state glass-card gsap-reveal" th:if="${requests == null or requests.isEmpty()}">
                <div class="empty-icon" style="filter: drop-shadow(0 0 10px var(--color-moss-emerald));">✓</div>
                <p class="text-muted">System Nominal. No pending authorization requests.</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
