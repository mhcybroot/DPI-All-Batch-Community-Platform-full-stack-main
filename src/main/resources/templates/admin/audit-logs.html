<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs — Admin — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>📋 Audit Logs</h1>
                <div class="actions">
                    <a th:href="@{/web/admin/approvals}" class="btn btn-secondary">Approvals</a>
                    <a th:href="@{/web/admin/users/create}" class="btn btn-secondary">Create User</a>
                    <a th:href="@{/web/admin/audit-logs}" class="btn btn-primary">Audit Logs</a>
                </div>
            </div>
            <div class="card" style="margin-bottom:1.5rem;">
                <form style="display:flex;gap:0.75rem;align-items:flex-end;">
                    <div class="form-group" style="margin-bottom:0;"><label class="form-label">User ID</label><input
                            type="number" name="userId" class="form-control" th:value="${searchUserId}"
                            placeholder="Enter user ID" style="max-width:200px;"></div>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </div>
            <div th:if="${logs != null and !logs.isEmpty()}" class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Timestamp</th>
                            <th>Actor ID</th>
                            <th>Action</th>
                            <th>Target</th>
                            <th>Details</th>
                            <th>IP</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td th:text="${log.id}">1</td>
                            <td th:text="${log.timestamp}">Time</td>
                            <td th:text="${log.actorId}">Actor</td>
                            <td><span class="badge badge-info" th:text="${log.action}">ACTION</span></td>
                            <td th:text="${log.targetId}">Target</td>
                            <td th:text="${log.details}"
                                style="max-width:300px;overflow:hidden;text-overflow:ellipsis;">Details</td>
                            <td th:text="${log.ipAddress}">IP</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="empty-state" th:if="${logs == null}">
                <div class="empty-icon">📋</div>
                <p>Enter a User ID above to search audit logs.</p>
            </div>
            <div class="empty-state" th:if="${logs != null and logs.isEmpty()}">
                <p>No audit logs found for this user.</p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
