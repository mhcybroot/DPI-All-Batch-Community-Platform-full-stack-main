<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>✏️ Edit Event</h1>
            </div>
            <form th:action="@{/web/events/{id}/edit(id=${event.id})}" method="post" class="card"
                style="max-width:600px;">
                <div class="form-group"><label class="form-label">Title</label><input type="text" name="title"
                        class="form-control" th:value="${event.title}" required></div>
                <div class="form-group"><label class="form-label">Description</label><textarea name="description"
                        class="form-control" rows="4" th:text="${event.description}"></textarea></div>
                <div class="form-group"><label class="form-label">Event Date</label><input type="datetime-local"
                        name="eventDate" class="form-control" th:value="${event.eventDate}"></div>
                <div class="form-group"><label class="form-label">Venue</label><input type="text" name="venue"
                        class="form-control" th:value="${event.venue}"></div>
                <div class="form-group"><label class="form-label">Venue Address</label><input type="text"
                        name="venueAddress" class="form-control" th:value="${event.venueAddress}"></div>
                <div class="form-group"><label class="form-label">Max Attendees</label><input type="number"
                        name="maxAttendees" class="form-control" th:value="${event.maxAttendees}"></div>
                <div class="form-group"><label class="form-label">Registration Deadline</label><input
                        type="datetime-local" name="registrationDeadline" class="form-control"
                        th:value="${event.registrationDeadline}"></div>
                <div class="form-group"><label class="form-label">Cover Image URL</label><input type="url"
                        name="coverImageUrl" class="form-control" th:value="${event.coverImageUrl}"></div>
                <div style="display:flex;gap:0.75rem;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/web/events/{id}(id=${event.id})}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
