<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Events — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>📅 My Organized Events</h1>
            </div>
            <div th:if="${events.isEmpty()}" class="empty-state">
                <div class="empty-icon">📅</div>
                <p>You haven't organized any events yet.</p><a th:href="@{/web/events/new}"
                    class="btn btn-primary">Create an Event</a>
            </div>
            <div th:unless="${events.isEmpty()}" class="card-grid">
                <div th:each="event : ${events}" class="card">
                    <h3 th:text="${event.title}">Event</h3>
                    <p><span class="badge" th:text="${event.status}">Status</span></p>
                    <p th:text="${event.eventDate}">Date</p>
                    <p th:text="${event.venue}">Venue</p>
                    <div style="display:flex;gap:0.5rem;margin-top:0.75rem;">
                        <a th:href="@{/web/events/{id}(id=${event.id})}" class="btn btn-primary btn-sm">View</a>
                        <a th:href="@{/web/events/{id}/edit(id=${event.id})}" class="btn btn-secondary btn-sm">Edit</a>
                        <a th:href="@{/web/events/{id}/registrations(id=${event.id})}"
                            class="btn btn-secondary btn-sm">Registrations</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
