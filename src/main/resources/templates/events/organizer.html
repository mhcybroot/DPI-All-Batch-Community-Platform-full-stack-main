<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title>Organizer Events - DPI Batch Meet</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Events by Organizer</h2>
            <a href="/web/events" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to All Events
            </a>
        </div>

        <div class="alert alert-info" th:if="${events.empty}">
            This organizer has no upcoming events.
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="event : ${events}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title mb-0">
                                <a th:href="@{/web/events/{id}(id=${event.id})}" class="text-decoration-none text-dark"
                                    th:text="${event.title}">Event Title</a>
                            </h5>
                            <span class="badge bg-primary" th:text="${event.status}">UPCOMING</span>
                        </div>
                        <p class="card-text text-muted small mb-2">
                            <i class="bi bi-calendar-event me-1"></i>
                            <span th:text="${#temporals.format(event.eventDate, 'MMM d, yyyy h:mm a')}">Date</span>
                        </p>
                        <p class="card-text text-truncate" th:text="${event.description}">Description</p>
                    </div>
                    <div class="card-footer bg-transparent border-top-0">
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted" th:text="${event.location}">Location</small>
                            <a th:href="@{/web/events/{id}(id=${event.id})}" class="btn btn-sm btn-outline-primary">View
                                Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
