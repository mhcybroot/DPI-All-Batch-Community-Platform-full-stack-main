<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Donor Profile — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/digital-mycelium.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Bio-Medical Theme Overrides */
        :root {
            --color-blood-crimson: #ef4444;
            --color-blood-dim: rgba(239, 68, 68, 0.2);
        }

        .bio-theme {
            --color-moss-emerald: var(--color-blood-crimson);
            --color-moss-emerald-dim: var(--color-blood-dim);
        }

        .stat-label {
            font-family: var(--font-machine);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            color: var(--color-silicon-gray);
            margin-bottom: 0.25rem;
            display: block;
        }

        .stat-value {
            font-family: var(--font-human);
            font-size: 1.5rem;
            color: var(--color-frozen-white);
        }
    </style>
</head>

<body class="bio-theme">
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header" style="margin-bottom: 3rem;">
                <h1 class="kinetic-text" data-text="Donor Metrics">Donor Metrics</h1>
                <div class="actions">
                    <a th:href="@{/web/blood-donors}" class="btn-magnetic">
                        <span>← Registry Index</span>
                    </a>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${profile == null}" class="glass-card"
                style="padding: 3rem; text-align: center; border-style: dashed;">
                <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;">🧬</div>
                <h3 style="margin-bottom: 0.5rem;">No Biological Data</h3>
                <p class="text-muted" style="margin-bottom: 2rem;">You are not currently indexed in the donor registry.
                </p>
                <a th:href="@{/web/blood-donors/register}" class="btn-magnetic btn-magnetic-primary">
                    <span>Initialize Registration</span>
                </a>
            </div>

            <!-- Profile Card -->
            <div th:if="${profile != null}" class="glass-card" style="max-width:600px; margin: 0 auto; padding: 0;">
                <div
                    style="padding: 2rem; border-bottom: 1px solid var(--color-glass-border); display: flex; align-items: center; justify-content: space-between;">
                    <div>
                        <span class="stat-label">IDENTITY_STATUS</span>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <div th:classappend="${profile.available ? 'pulse-dot' : ''}"
                                th:style="${profile.available ? 'color: var(--color-blood-crimson);' : 'color: var(--color-silicon-gray);'}"
                                style="width: 10px; height: 10px; border-radius: 50%; background: currentColor;"></div>
                            <span th:text="${profile.available ? 'ACTIVE' : 'DORMANT'}" class="mono-text"
                                style="color: var(--color-frozen-white);">Active</span>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <span class="stat-label">BLOOD_TYPE</span>
                        <div class="stat-value"
                            style="color: var(--color-blood-crimson); font-size: 2.5rem; line-height: 1;">
                            <span th:text="${profile.bloodGroup}">A+</span>
                        </div>
                    </div>
                </div>

                <div style="padding: 2rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
                        <div>
                            <span class="stat-label">SECTOR_LOC</span>
                            <div class="stat-value" style="font-size: 1.25rem;" th:text="${profile.location}">Location
                            </div>
                        </div>
                        <div>
                            <span class="stat-label">LAST_EXTRACTION</span>
                            <div class="stat-value" style="font-size: 1.25rem;"
                                th:text="${profile.lastDonationDate != null ? profile.lastDonationDate : 'N/A'}">N/A
                            </div>
                        </div>
                    </div>

                    <div
                        style="background: rgba(255,255,255,0.02); border-radius: 8px; padding: 1.5rem; border: 1px solid var(--color-glass-border);">
                        <h4 class="mono-text"
                            style="font-size: 0.9rem; margin-bottom: 1rem; color: var(--color-silicon-gray);">
                            CONTROL_PANEL</h4>

                        <!-- Availability Toggles -->
                        <div style="display:flex; gap: 0.5rem; margin-bottom: 1.5rem;">
                            <form th:action="@{/web/blood-donors/availability}" method="post" style="flex: 1;">
                                <input type="hidden" name="isAvailable" value="true">
                                <button type="submit" class="btn-magnetic" th:disabled="${profile.available}"
                                    style="width: 100%; border-color: var(--color-blood-crimson); color: var(--color-frozen-white);">
                                    <span>Set Active</span>
                                </button>
                            </form>
                            <form th:action="@{/web/blood-donors/availability}" method="post" style="flex: 1;">
                                <input type="hidden" name="isAvailable" value="false">
                                <button type="submit" class="btn-magnetic" th:disabled="${!profile.available}"
                                    style="width: 100%; border-color: var(--color-silicon-gray); color: var(--color-silicon-gray);">
                                    <span>Set Dormant</span>
                                </button>
                            </form>
                        </div>

                        <!-- Update Date -->
                        <form th:action="@{/web/blood-donors/last-donation}" method="post">
                            <label class="stat-label">UPDATE_CYCLE_DATE</label>
                            <div style="display:flex; gap: 0.5rem;">
                                <input type="date" name="lastDonationDate" class="glass-input form-control"
                                    th:value="${profile.lastDonationDate}" style="flex: 1; color-scheme: dark;">
                                <button type="submit" class="btn-magnetic btn-magnetic-primary"
                                    style="padding: 0 1.5rem;">
                                    <span>Sync</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
    <script th:src="@{/js/app.js}"></script>
    <script>
        if (typeof initMagneticButtons === 'function') {
            initMagneticButtons();
        }
    </script>
</body>

</html>
