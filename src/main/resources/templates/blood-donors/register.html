<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Blood Donor — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>🩸 Register as Blood Donor</h1>
            </div>
            <form th:action="@{/web/blood-donors/register}" method="post" class="card" style="max-width:500px;">
                <div class="form-group"><label class="form-label">Blood Group</label>
                    <select name="bloodGroup" class="form-control" required>
                        <option value="">Select...</option>
                        <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg}"></option>
                    </select>
                </div>
                <div class="form-group"><label class="form-label">Location</label><input type="text" name="location"
                        class="form-control" required placeholder="Your city/area"></div>
                <div class="form-group"><label class="form-label">Last Donation Date</label><input type="date"
                        name="lastDonationDate" class="form-control"></div>
                <div class="form-group"><label class="form-label"><input type="checkbox" name="isAvailable" value="true"
                            checked> Available for donation</label></div>
                <div style="display:flex;gap:0.75rem;"><button type="submit" class="btn btn-primary">Register</button><a
                        th:href="@{/web/blood-donors}" class="btn btn-secondary">Cancel</a></div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
