<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Blood Donor — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/digital-mycelium.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Bio-Medical Theme Overrides */
        :root {
            --color-blood-crimson: #ef4444;
            --color-blood-dim: rgba(239, 68, 68, 0.2);
        }

        .bio-theme {
            --color-moss-emerald: var(--color-blood-crimson);
            --color-moss-emerald-dim: var(--color-blood-dim);
        }

        /* Custom Checkbox for Glass */
        .glass-checkbox {
            accent-color: var(--color-blood-crimson);
            width: 1.2rem;
            height: 1.2rem;
        }
    </style>
</head>

<body class="bio-theme">
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header" style="margin-bottom: 2rem;">
                <h1 class="kinetic-text" data-text="Donor Enrollment">Donor Enrollment</h1>
            </div>

            <div class="glass-card"
                style="max-width:600px; margin: 0 auto; padding: 2rem; position: relative; overflow: hidden;">
                <!-- Decorative Element -->
                <div
                    style="position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: radial-gradient(circle, var(--color-blood-dim), transparent 70%); border-radius: 50%; pointer-events: none;">
                </div>

                <form th:action="@{/web/blood-donors/register}" method="post" style="position: relative; z-index: 1;">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="mono-text"
                            style="color: var(--color-silicon-gray); font-size: 0.8rem; margin-bottom: 0.5rem; display: block;">BLOOD_TYPE_DESIGNATION</label>
                        <select name="bloodGroup" class="glass-input form-control" required style="width: 100%;">
                            <option value="" style="color: var(--color-silicon-gray);">Select Blood Group...</option>
                            <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg}"></option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="mono-text"
                            style="color: var(--color-silicon-gray); font-size: 0.8rem; margin-bottom: 0.5rem; display: block;">GEOGRAPHIC_VECTOR</label>
                        <input type="text" name="location" class="glass-input form-control" required
                            placeholder="City or Area Name..." style="width: 100%;">
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="mono-text"
                            style="color: var(--color-silicon-gray); font-size: 0.8rem; margin-bottom: 0.5rem; display: block;">LAST_EXTRACTION_DATE</label>
                        <input type="date" name="lastDonationDate" class="glass-input form-control"
                            style="width: 100%; color-scheme: dark;">
                    </div>

                    <div class="form-group"
                        style="margin-bottom: 2rem; display: flex; align-items: center; gap: 0.75rem; background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 8px; border: 1px solid var(--color-glass-border);">
                        <input type="checkbox" name="isAvailable" value="true" checked class="glass-checkbox">
                        <label class="text-muted" style="margin: 0;">Mark status as <strong
                                style="color: var(--color-frozen-white);">Active Donor</strong> (Visible to
                            search)</label>
                    </div>

                    <div style="display:flex; gap:1rem; margin-top: 2rem;">
                        <button type="submit" class="btn-magnetic btn-magnetic-primary" style="flex: 1;">
                            <span>Confirm Registration</span>
                        </button>
                        <a th:href="@{/web/blood-donors}" class="btn-magnetic"
                            style="flex: 1; text-align: center; text-decoration: none;">
                            <span>Cancel Operation</span>
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
    <script th:src="@{/js/app.js}"></script>
    <script>
        if (typeof initMagneticButtons === 'function') {
            initMagneticButtons();
        }
    </script>
</body>

</html>
