<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — DPI Community' : 'DPI Batch Community Platform'}">DPI
        Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Scripts -->
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>

<body>
    <!-- System Boot Overlay -->
    <div id="boot-overlay">
        <div class="boot-content">
            <div class="boot-logo">🛡️</div>
            <div class="boot-text">INITIALIZING...</div>
            <div class="boot-progress">
                <div class="boot-bar"></div>
            </div>
        </div>
    </div>

    <!-- Inline script to prevent FOUC of boot screen -->
    <script>
        // Check session storage immediately
        if (!sessionStorage.getItem('dpi_booted')) {
            document.documentElement.classList.add('boot-pending');
        }
    </script>

    <!-- Navbar -->
    <!-- Navbar -->
    <!-- Neural Command Bar -->
    <header class="neural-head" th:fragment="navbar">
        <nav class="command-deck">
            <!-- Left: System Status & ID -->
            <div class="deck-left">
                <div class="sys-stat-group">
                    <span class="sys-dot"></span>
                    <span class="sys-dot"></span>
                    <span class="sys-dot"></span>
                </div>
                <div class="project-id kinetic-text" style="font-family: var(--font-display);">
                    <span class="hex-deco">0x4D</span>
                    <a href="/web/dashboard">DPI::NET</a>
                </div>
            </div>

            <!-- Center: Navigation Modules -->
            <ul class="deck-modules">
                <li><a th:href="@{/web/dashboard}" class="deck-module"
                        th:classappend="${activeNav == 'dashboard' ? 'active' : ''}" data-hover="glitch">DASHBOARD</a>
                </li>
                <li><a th:href="@{/web/forum}" class="deck-module"
                        th:classappend="${activeNav == 'forum' ? 'active' : ''}" data-hover="glitch">FORUM</a></li>
                <li><a th:href="@{/web/events}" class="deck-module"
                        th:classappend="${activeNav == 'events' ? 'active' : ''}" data-hover="glitch">EVENTS</a></li>
                <li><a th:href="@{/web/knowledge}" class="deck-module"
                        th:classappend="${activeNav == 'knowledge' ? 'active' : ''}" data-hover="glitch">UPLINK</a></li>
                <li><a th:href="@{/web/notices}" class="deck-module"
                        th:classappend="${activeNav == 'notices' ? 'active' : ''}" data-hover="glitch">BROADCASTS</a>
                </li>
                <li><a th:href="@{/web/memories}" class="deck-module"
                        th:classappend="${activeNav == 'memories' ? 'active' : ''}" data-hover="glitch">ARCHIVE</a></li>
                <li><a th:href="@{/web/jobs}" class="deck-module"
                        th:classappend="${activeNav == 'jobs' ? 'active' : ''}" data-hover="glitch">CONTRACTS</a></li>
                <li><a th:href="@{/web/mentorship}" class="deck-module"
                        th:classappend="${activeNav == 'mentorship' ? 'active' : ''}" data-hover="glitch">NEURAL</a>
                </li>
                <li><a th:href="@{/web/directory}" class="deck-module"
                        th:classappend="${activeNav == 'directory' ? 'active' : ''}" data-hover="glitch">DIRECTORY</a>
                </li>
                <li sec:authorize="hasRole('ADMINISTRATOR')">
                    <a th:href="@{/web/admin/approvals}" class="deck-module admin-module"
                        th:classappend="${activeNav == 'admin' ? 'active' : ''}" data-hover="glitch">>> ROOT ACCESS</a>
                </li>
            </ul>

            <!-- Right: Identity & Phase Shift -->
            <div class="deck-right">
                <button id="theme-toggle" class="phase-shift-btn" data-magnetic aria-label="Toggle Phase">
                    <span id="theme-icon">👁</span>
                </button>

                <div class="bio-auth-chip" sec:authorize="isAuthenticated()">
                    <a th:href="@{/web/profile}">
                        <span class="auth-status"></span>
                        <span sec:authentication="name" class="auth-id">USER_ID</span>
                    </a>
                </div>

                <form th:action="@{/web/auth/logout}" method="post" sec:authorize="isAuthenticated()">
                    <button type="submit" class="disconnect-btn">EJECT</button>
                </form>

                <button class="nav-toggle btn-magnetic" data-magnetic aria-label="Toggle navigation">☰</button>
            </div>
        </nav>

    </header>

    <script>
        (function () {
            const toggle = document.getElementById('theme-toggle');
            const icon = document.getElementById('theme-icon');
            const root = document.documentElement;
            const STORAGE_KEY = 'dpi_theme';

            // Icons
            const ICON_BIO = '👁'; // Biological
            const ICON_FROST = '❄'; // Frosted

            function setTheme(theme) {
                root.setAttribute('data-theme', theme);
                localStorage.setItem(STORAGE_KEY, theme);
                icon.textContent = theme === 'frosted' ? ICON_FROST : ICON_BIO;
            }

            // Init
            const savedTheme = localStorage.getItem(STORAGE_KEY) || 'biological';
            setTheme(savedTheme);

            // Toggle
            if (toggle) {
                toggle.addEventListener('click', () => {
                    const current = root.getAttribute('data-theme');
                    const next = current === 'biological' ? 'frosted' : 'biological';
                    setTheme(next);
                });
            }
        })();
    </script>

    <!-- Flash Messages -->
    <div class="container" th:if="${successMessage != null or errorMessage != null}" style="margin-top: 1rem;">
        <div class="alert alert-success" th:if="${successMessage}" data-auto-dismiss>
            ✓ <span th:text="${successMessage}"></span>
        </div>
        <div class="alert alert-danger" th:if="${errorMessage}" data-auto-dismiss>
            ✕ <span th:text="${errorMessage}"></span>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container" th:replace="${content}">
            <!-- Page content injected here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform. Built with ❤️ by our community.</p>
        </div>
    </footer>

</body>

</html>
