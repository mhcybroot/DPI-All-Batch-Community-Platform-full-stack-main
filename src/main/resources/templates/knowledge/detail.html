<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${question.title + ' — DPI Q&amp;A'}">Q&amp;A — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/digital-mycelium.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <style>
        /* Neural Hive Theme Overrides */
        :root {
            --color-neural-cyan: #06b6d4;
            --color-neural-dim: rgba(6, 182, 212, 0.1);
            --color-neural-glow: rgba(6, 182, 212, 0.4);
        }

        .neural-theme {
            --color-moss-emerald: var(--color-neural-cyan);
            --color-moss-emerald-dim: var(--color-neural-dim);
        }
    </style>
</head>

<body class="neural-theme">
    <div th:replace="~{layout/base :: navbar}"></div>

    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="glass-card" style="padding: 1rem; border-color: var(--color-neural-cyan);" data-auto-dismiss>
            <span class="text-green">✓</span> <span th:text="${successMessage}"></span>
        </div>
    </div>

    <main class="main-content">
        <div class="container">
            <a th:href="@{/web/knowledge}" class="btn-magnetic" style="margin-bottom:1rem; display: inline-flex;">
                <span>← Return to Hive</span>
            </a>

            <!-- Question Card -->
            <div class="glass-card gsap-reveal" style="margin-bottom:2rem; padding: 2rem;">
                <div style="display:flex; gap:1.5rem;">
                    <!-- Voting Side -->

                    <!-- Content Side -->
                    <div style="flex:1;">
                        <h1 class="kinetic-text" th:text="${question.title}"
                            style="margin-bottom:1rem; line-height: 1.3;">Title</h1>

                        <div style="white-space: pre-wrap; word-break: break-word; margin-bottom:1.5rem; line-height: 1.6; color: var(--color-frozen-white); font-size: 1.1rem;"
                            th:text="${question.body}">Content</div>

                        <div class="tag-list" th:if="${question.tags != null}"
                            style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem;">
                            <span th:each="tag : ${question.tags}" class="mono-text"
                                style="font-size: 0.8rem; padding: 0.2rem 0.75rem; border: 1px solid var(--color-neural-cyan); border-radius: 20px; color: var(--color-neural-cyan); background: var(--color-neural-dim);">
                                #<span th:text="${tag}">Tag</span>
                            </span>
                        </div>

                        <div class="card-meta"
                            style="border-top: 1px solid var(--color-glass-border); padding-top: 1rem; display: flex; justify-content: space-between;">
                            <span class="mono-text" style="color: var(--color-silicon-gray); font-size: 0.9rem;"
                                th:text="${'INJECTED: ' + #temporals.format(question.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Answers Section -->
            <div class="gsap-reveal" style="margin-bottom: 2rem;">
                <h2 class="kinetic-text" data-text="Responses" style="margin-bottom: 1.5rem;">
                    Signal Responses (<span th:text="${answersPage != null ? answersPage.totalElements : 0}">0</span>)
                </h2>

                <!-- Items per page selector -->
                <div class="pagination-controls" th:if="${answersPage != null and answersPage.totalElements > 0}">
                    <form method="get" th:action="@{/web/knowledge/{id}(id=${question.id})}">
                        <label>Show:</label>
                        <select name="size" onchange="this.form.submit()">
                            <option th:value="10" th:selected="${answersPage.size == 10}">10</option>
                            <option th:value="20" th:selected="${answersPage.size == 20}">20</option>
                            <option th:value="50" th:selected="${answersPage.size == 50}">50</option>
                        </select>
                    </form>
                </div>

                <div th:each="answer : ${answersPage.content}" class="glass-card"
                    th:style="${answer.accepted ? 'margin-bottom:1rem; border-color: var(--color-neural-cyan); box-shadow: 0 0 20px var(--color-neural-dim);' : 'margin-bottom:1rem;'}"
                    style="margin-bottom:1rem;">

                    <div style="display:flex; gap:1.5rem; padding: 1.5rem;">
                        <!-- Answer Voting -->

                        <!-- Answer Content -->
                        <div style="flex:1;">
                            <div th:if="${answer.accepted}" class="mono-text"
                                style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--color-neural-cyan); margin-bottom: 1.5rem; padding: 0.4rem 1rem; background: var(--color-neural-dim); border-radius: 12px; font-size: 0.8rem; border: 1px solid var(--color-neural-cyan);">
                                <span>✓ VALIDATED SOLUTION</span>
                            </div>

                            <div style="white-space: pre-wrap; word-break: break-word; line-height: 1.6; margin-bottom: 1rem;"
                                th:text="${answer.body}">Answer</div>

                            <div class="card-footer"
                                style="display: flex; justify-content:space-between; align-items: center; border-top: 1px solid var(--color-glass-border); padding-top: 1rem;">
                                <span class="mono-text" style="color: var(--color-silicon-gray); font-size: 0.8rem;"
                                    th:text="${'T: ' + #temporals.format(answer.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>

                                <form th:unless="${answer.accepted}"
                                    th:action="@{/web/knowledge/answers/{id}/accept(id=${answer.id})}" method="post">
                                    <input type="hidden" name="questionId" th:value="${question.id}">
                                    <button class="btn-magnetic" type="submit"
                                        style="padding: 0.25rem 1rem; font-size: 0.8rem;">
                                        <span>Accept Signal</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" th:if="${answersPage.totalPages > 1}" style="margin-top: 2rem;">
                    <a th:if="${answersPage.hasPrevious()}"
                        th:href="@{/web/knowledge/{id}(id=${question.id}, page=${answersPage.number - 1}, size=${answersPage.size})}"
                        class="btn btn-secondary btn-sm">Previous</a>

                    <span th:each="i : ${#numbers.sequence(0, answersPage.totalPages - 1)}">
                        <a th:href="@{/web/knowledge/{id}(id=${question.id}, page=${i}, size=${answersPage.size})}"
                            th:text="${i + 1}"
                            th:class="${i == answersPage.number ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'}">1</a>
                    </span>

                    <a th:if="${answersPage.hasNext()}"
                        th:href="@{/web/knowledge/{id}(id=${question.id}, page=${answersPage.number + 1}, size=${answersPage.size})}"
                        class="btn btn-secondary btn-sm">Next</a>
                </div>
            </div>

            <!-- Add Answer Form -->
            <form th:action="@{/web/knowledge/{id}/answer(id=${question.id})}" method="post"
                class="glass-card gsap-reveal" style="padding: 2rem;">
                <h3 class="mono-text" style="color: var(--color-neural-cyan); margin-bottom: 1rem;">TRANSMIT_RESPONSE
                </h3>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <textarea name="content" class="glass-input form-control" rows="6" required
                        placeholder="Share your technical analysis..."
                        style="width: 100%; font-family: var(--font-interface);"></textarea>
                </div>

                <button type="submit" class="btn-magnetic btn-magnetic-primary">
                    <span>Broadcast Response</span>
                </button>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
    <script>
        if (typeof initMagneticButtons === 'function') {
            initMagneticButtons();
        }
    </script>
</body>

</html>
