<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Q&amp;A — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/digital-mycelium.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <style>
        /* Neural Hive Theme Overrides */
        :root {
            --color-neural-cyan: #06b6d4;
            --color-neural-dim: rgba(6, 182, 212, 0.1);
            --color-neural-glow: rgba(6, 182, 212, 0.4);
        }

        .neural-theme {
            --color-moss-emerald: var(--color-neural-cyan);
            --color-moss-emerald-dim: var(--color-neural-dim);
        }

        .question-card {
            transition: all 0.3s var(--ease-organic);
            border-left: 2px solid transparent;
        }

        .question-card:hover {
            border-left-color: var(--color-neural-cyan);
            transform: translateX(5px);
        }

        .stat-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--color-glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        .stat-badge.answered {
            border-color: var(--color-neural-cyan);
            background: var(--color-neural-dim);
            color: var(--color-neural-cyan);
        }

        .stat-value {
            font-family: var(--font-machine);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }
    </style>
</head>

<body class="neural-theme">
    <div th:replace="~{layout/base :: navbar}"></div>

    <div class="container" th:if="${successMessage}" style="margin-top:1rem;">
        <div class="glass-card" style="padding: 1rem; border-color: var(--color-neural-cyan);" data-auto-dismiss>
            <span class="text-green">✓</span> <span th:text="${successMessage}"></span>
        </div>
    </div>

    <main class="main-content">
        <div class="container">
            <div class="page-header kinetic-text"
                style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
                <div>
                    <h1 data-text="Neural Collective">Neural Collective</h1>
                    <p class="text-muted" style="margin-top: 0.5rem;">Knowledge Base & Query Resolution Node</p>
                </div>
                <a th:href="@{/web/knowledge/ask}" class="btn-magnetic btn-magnetic-primary">
                    <span>+ Inject Query</span>
                </a>
            </div>

            <!-- Filter Tabs -->
            <div class="glass-card"
                style="padding: 0.5rem; display: inline-flex; gap: 0.5rem; margin-bottom: 2rem; border-radius: 50px;">
                <a th:href="@{/web/knowledge(sort='newest')}" class="btn-magnetic"
                    th:classappend="${sort == 'newest' ? 'btn-magnetic-primary' : ''}"
                    style="border-radius: 20px; padding: 0.5rem 1.5rem; border: none;">
                    <span>Newest Signals</span>
                </a>
                <a th:href="@{/web/knowledge(sort='answers')}" class="btn-magnetic"
                    th:classappend="${sort == 'answers' ? 'btn-magnetic-primary' : ''}"
                    style="border-radius: 20px; padding: 0.5rem 1.5rem; border: none;">
                    <span>Most Discussed</span>
                </a>
            </div>

            <!-- Questions List -->
            <div th:if="${questionsPage != null and questionsPage.hasContent()}" class="floating-grid"
                style="display: flex; flex-direction: column; gap: 1rem;">
                <div th:each="q : ${questionsPage.content}" class="glass-card question-card gsap-reveal"
                    style="padding: 1.5rem; display: flex; gap: 1.5rem; text-decoration: none; color: inherit;">

                    <!-- Stats Column -->
                    <div style="display: flex; gap: 0.5rem; align-items: flex-start;">
                        <div class="stat-badge" th:classappend="${q.answerCount > 0 ? 'answered' : ''}">
                            <span class="stat-value" th:text="${q.answerCount}">0</span>
                            <span class="stat-label">ANS</span>
                        </div>
                    </div>

                    <!-- Content Column -->
                    <div style="flex: 1;">
                        <a th:href="@{/web/knowledge/{id}(id=${q.id})}" style="text-decoration: none;">
                            <h3 class="kinetic-text" th:text="${q.title}"
                                style="font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--color-frozen-white);">
                                Title</h3>
                        </a>

                        <div class="card-meta"
                            style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
                            <span class="mono-text" style="font-size: 0.8rem; color: var(--color-silicon-gray);"
                                th:text="${#temporals.format(q.createdAt, 'dd MMM HH:mm')}">Date</span>

                            <div th:if="${q.tags}" style="display: flex; gap: 0.5rem;">
                                <span th:each="tag : ${q.tags}" class="mono-text"
                                    style="font-size: 0.75rem; padding: 0.1rem 0.5rem; border: 1px solid var(--color-glass-border); border-radius: 4px; color: var(--color-neural-cyan);">
                                    #<span th:text="${tag}">tag</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" th:if="${questionsPage.totalPages > 1}"
                    style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
                    <a th:if="${questionsPage.number > 0}"
                        th:href="@{/web/knowledge(sort=${sort},page=${questionsPage.number - 1})}"
                        class="btn-magnetic">← Previous Node</a>
                    <span class="glass-card" style="padding: 0.5rem 1rem; align-self: center;"
                        th:text="${questionsPage.number + 1 + ' / ' + questionsPage.totalPages}">1/1</span>
                    <a th:if="${questionsPage.number < questionsPage.totalPages - 1}"
                        th:href="@{/web/knowledge(sort=${sort},page=${questionsPage.number + 1})}"
                        class="btn-magnetic">Next Node →</a>
                </div>
            </div>

            <!-- Empty State -->
            <div class="glass-card empty-state" th:if="${questionsPage == null or !questionsPage.hasContent()}"
                style="padding: 4rem; text-align: center;">
                <div style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.5;">📡</div>
                <h3 style="margin-bottom: 0.5rem;">No Signals Detected</h3>
                <p class="text-muted">The collective is silent. Initiate a new query sequence.</p>
                <div style="margin-top: 2rem;">
                    <a th:href="@{/web/knowledge/ask}" class="btn-magnetic btn-magnetic-primary">Initialize Query</a>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
    <script>
        if (typeof initMagneticButtons === 'function') {
            initMagneticButtons();
        }
    </script>
</body>

</html>
