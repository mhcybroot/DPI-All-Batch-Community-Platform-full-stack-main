<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask a Question — DPI Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{layout/base :: navbar}"></div>
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>❓ Ask a Question</h1>
            </div>
            <form th:action="@{/web/knowledge/ask}" method="post" class="card" style="max-width:600px;">
                <div class="form-group"><label class="form-label">Title</label><input type="text" name="title"
                        class="form-control" required placeholder="What's your question?"></div>
                <div class="form-group"><label class="form-label">Details</label><textarea name="body"
                        class="form-control" rows="6" required placeholder="Provide context and details..."></textarea>
                </div>
                <div class="form-group"><label class="form-label">Tags (comma-separated)</label><input type="text"
                        name="tags" class="form-control" placeholder="java, spring-boot, api"></div>
                <div style="display:flex;gap:0.75rem;"><button type="submit" class="btn btn-primary">Post
                        Question</button><a th:href="@{/web/knowledge}" class="btn btn-secondary">Cancel</a></div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2026 DPI Batch Community Platform</p>
        </div>
    </footer>
</body>

</html>
